name: secret-and-hidden-boundary

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须扫全历史：Git 克隆会带出完整对象历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --quiet pyyaml python-docx

      - name: Hidden benchmark boundary (worktree + git history)
        run: |
          cd ci/checkers
          python3 check_hidden_benchmark_boundary.py

      - name: External review claim boundary
        run: |
          cd ci/checkers
          python3 check_external_review_claims.py

      - name: Secret pattern scan
        run: |
          set -o pipefail
          PATTERNS='sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{30,}'
          if git grep -nIE "$PATTERNS" -- . ':(exclude).github/workflows/secret-and-hidden-boundary.yml'; then
            echo "FAIL secret_scan: credential-like pattern found in tracked files"
            exit 1
          fi
          echo "PASS secret_scan: no credential-like pattern in tracked files"

      - name: Real brand / customer data boundary
        run: |
          set -o pipefail
          if git grep -nI -e "真实顾客档案" -e "真实库存快照" -e "REAL_CUSTOMER_RECORD" -- . ':(exclude).github/workflows/secret-and-hidden-boundary.yml'; then
            echo "FAIL public_repo_boundary: real brand or customer data marker found"
            exit 1
          fi
          echo "PASS public_repo_boundary: no real brand or customer data marker"
