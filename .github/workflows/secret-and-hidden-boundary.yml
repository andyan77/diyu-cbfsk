name: secret-and-hidden-boundary

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    env:
      # 单一定义处（EQ-1）：「Secret pattern scan」与「Leak detector self-test」引用同一把尺子。
      # 该串与改造前逐字相同，只是从步骤内联提到 job env，好让自测复用它——检测内容一个字没改。
      SECRET_PATTERNS: |-
        sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{30,}
      # 真实泄露模式，不是业务概念词。守三类实际泄露形态：凭据、自然人身份标识、真实客户数据文件。
      # 商品事实、库存快照、品牌规则、商品池、用户画像模型字段等领域语言一律不在扫描面内——
      # 改造前扫「真实库存快照」这类中文业务词，业务源码正常出现即判红（已复现）。
      # 分支说明：
      #   1 中国大陆手机号；前后不得是字母数字，避免命中十六进制哈希片段
      #   2 十八位身份证号，含出生日期结构约束
      #   3 凭据赋值：api_key / secret / token / password / credential 后跟 16 位以上取值
      #   4 STORE-A 隐藏评测库的凭证、密钥、令牌
      #   5 真实客户数据文件：概念词必须紧跟真实文件扩展名，或落在客户档案目录路径下
      LEAK_PATTERNS: |-
        (?<![0-9A-Za-z])1[3-9][0-9]{9}(?![0-9A-Za-z])|(?<![0-9A-Za-z])[1-9][0-9]{5}(?:19|20)[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])[0-9]{3}[0-9Xx](?![0-9A-Za-z])|(?i)(?:api[_-]?key|secret|token|password|passwd|credential)\s*[:=]\s*\S{0,2}[A-Za-z0-9_\-/+]{16,}|(?i)STORE[_-]?A[_-]?(?:CREDENTIAL|TOKEN|SECRET|PASSWORD|APIKEY)|(?i)STORE-A\s*(?:凭证|密钥|口令|令牌)|(?i)(?:真实顾客|真实客户|real[_-]?customer)\S{0,64}\.(?:csv|xlsx|xls|json|jsonl|sql|db|sqlite|parquet)|[\\/](?:customers?|顾客档案|客户档案)[\\/]\S*\.(?:csv|xlsx|xls|json|jsonl|sql|db|sqlite|parquet)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须扫全历史：Git 克隆会带出完整对象历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-ci.txt

      - name: Hidden benchmark boundary (worktree + git history)
        run: |
          cd ci/checkers
          python3 check_hidden_benchmark_boundary.py

      - name: External review claim boundary
        run: |
          cd ci/checkers
          python3 check_external_review_claims.py

      - name: Secret pattern scan
        run: |
          set -o pipefail
          if git grep -nIE "$SECRET_PATTERNS" -- . ':(exclude).github/workflows/secret-and-hidden-boundary.yml'; then
            echo "FAIL secret_scan: credential-like pattern found in tracked files"
            exit 1
          fi
          echo "PASS secret_scan: no credential-like pattern in tracked files"

      - name: Real leak boundary (credentials / natural-person identifiers / customer data files)
        run: |
          set -o pipefail
          if git grep -nIP "$LEAK_PATTERNS" -- . ':(exclude).github/workflows/secret-and-hidden-boundary.yml'; then
            echo "FAIL leak_boundary: real leak pattern found in tracked files"
            exit 1
          fi
          echo "PASS leak_boundary: no credential / identifier / customer-data-file leak in tracked files"

      - name: Leak detector self-test (negative + positive fixtures)
        run: |
          set -euo pipefail
          # EQ-3：只有正向断言不算验证过。本步骤在仓外临时目录里种下已知泄露与正常业务措辞，
          # 证明「该抓的抓得住、不该抓的不误伤」。换了尺子却抓不住真凭据，等于把 M1「假绿」教训再丢一次。
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          fail=0

          hit() {
            grep -qIE "$SECRET_PATTERNS" "$WORK/case.txt" || grep -qIP "$LEAK_PATTERNS" "$WORK/case.txt"
          }
          neg() {
            printf '%s\n' "$2" > "$WORK/case.txt"
            if hit; then
              echo "PASS negative_fixture[$1]: detected"
            else
              echo "FAIL negative_fixture[$1]: NOT detected —— 检测器漏掉了真实泄露"
              fail=1
            fi
          }
          pos() {
            printf '%s\n' "$2" > "$WORK/case.txt"
            if hit; then
              echo "FAIL positive_fixture[$1]: false alarm on ordinary business wording"
              fail=1
            else
              echo "PASS positive_fixture[$1]: not flagged"
            fi
          }

          neg openai_key      'OPENAI_KEY = sk-abcdefghijklmnopqrstuvwx'
          neg aws_access_key  'aws_access_key_id: AKIAIOSFODNN7EXAMPLE'
          neg private_key     '-----BEGIN RSA PRIVATE KEY-----'
          neg cn_mobile       'contact phone: 13800138000'
          neg cn_id_card      'id_number: 110101199003072316'
          neg customer_file   'source: data/真实客户档案_2026.csv'
          neg customer_dir    'path: /var/data/customers/export_2026.xlsx'
          neg store_a_cred    'STORE_A_CREDENTIAL=placeholderplaceholder'
          neg bearer_token    'access_token: abcdefghijklmnopqrstuvwxyz012345'

          pos inventory       'InventorySnapshot 表示某一时刻的真实库存快照，由品牌数据库同步。'
          pos brand_rule      'BrandRuleSet 承载品牌规则，商品池 ProductPool 只引用不复制。'
          pos audience        'audience_profile 是用户画像模型字段集合，不含任何自然人身份信息。'
          pos product_fact    '商品事实以品牌数据库为权威来源，视觉推断不得覆盖权威事实。'
          pos commit_hash     'baseline_commit: a5564e1a4455b6521ae3c5e0b15385052c86c867'
          pos real_customer_concept '本里程碑不得接入真实顾客，真实客户数据一律不进主仓。'

          if [ "$fail" -ne 0 ]; then
            echo "FAIL leak_detector_self_test: 见上方逐条结果"
            exit 1
          fi
          echo "PASS leak_detector_self_test: 9 negative + 6 positive fixtures all behaved as declared"
