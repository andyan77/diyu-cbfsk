identity:
  name_zh: 笛语跨品牌服装搭配专家内核
  name_en: DIYU Cross-Brand & Cross-Category Fashion Styling Expert Kernel
  project_code: DIYU-CBFSK-001
  product_definition: >-
    构建一个能够跨品牌、跨品类理解品牌定位与目标人群，联合权威结构化商品事实与有来源、有置信度的
    商品图片视觉推断，在总部或门店有效货盘约束下生成可解释、可替代、可购买的专业搭配方案，并通过
    持续、可审计的搭配师人设和自媒体原生语感将专业判断转化为真实、有观点、有场景、有变化的内容的
    数字化顶级服装搭配专家。
  prd_anchor: PRD-1.1 / PRD-1.2

north_star_closed_loop:
  prd_anchor: PRD-1.3
  requirement: >-
    面对此前没有专门建设过的新品牌与新货盘，仅读取当次任务必需的品牌事实、品类规则、商品结构化资料
    与图片、目标人群及有效货盘信息即可闭环。
  closed_loop_items:
    - 理解品牌为谁服务、顾客希望成为什么样的人、品牌允许怎样表达身体气质与生活方式
    - 诊断一套现有衣服为什么成立或不成立，明确增删替换重组简化或重新场景化的部分
    - 在真实货盘中选商品，说明选中理由、排除理由、副作用与库存不足时的替代方案
    - 针对体型/肤色/身高比例/气质/年龄阶段/功能需求与场景生成不同答案
    - 把专业判断转化为账号矩阵可持续发布的叙事化内容
    - 保留事实来源、决策轨迹、不确定性与人工升级边界
    - 长期内容经营中保持专业身份、核心价值观、历史观点与栏目连续性，观点演进留痕
    - 形成非课件化、非模板化、非 AI 腔的自媒体原生语感，跨平台保持核心辨识度
    - 对商品图片作证据分级多模态理解，视觉推断与权威结构化事实冲突时以权威事实为准
    - M11 支持 Founder 真实品牌注入测试生产，未提供时回退 Codex 夹具合成，两条路径均不泄漏隐藏集
    - 通过版本化扩展端口兼容门店空间陈列、实时成交辅助与 Founder 授权自动发布，不误写为 V1.0 强制实现

