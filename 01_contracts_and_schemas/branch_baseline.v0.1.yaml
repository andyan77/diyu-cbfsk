# ---------------------------------------------------------------------------
# 一之三、明确延期事项（最终收敛版第八节）
# ---------------------------------------------------------------------------
deferred_items:
  rule: >-
    能阻塞 BR0-EP01 的问题在本包处理；不能阻塞的一律延期。禁止为追求完整性扩大范围。
  items:
    - item: Error Taxonomy 机器可读化
      owner_package: BR1
      constraint: 必须沿用 PRD 附录 B 原编号 AUTH-/INPUT-/FACT-/RULE-；不得新造 ERR_* 体系
      evidence: 实测 PRD v0.3.2 附录 B 现有 AUTH- 3 条、INPUT- 5 条、FACT- 5 条、RULE- 5 条；全文 ERR_ 0 处
    - item: Mock/Real 详细边界
      owner_package: BR1-EP03
    - item: Human Review 边界
      owner_package: BR1-EP04
    - item: ECS 部署拓扑
      owner_package: BR0-EP01
      note: 属 Runtime Skeleton 交付物，非 deferred 之外的独立工作
    - item: Migration 规范细节
      owner_package: BR0-EP01
    - item: Stop Conditions 扩展
      owner_package: BR3
      constraint: 修改既有 non_goals_and_stop_conditions.v1.0.yaml；不得新建 md
    - item: 商业反馈闭环 / Pilot 相关
      owner_package: BR6 / BR7
    - item: 27 张规划卡补齐
      owner_package: 各自 freeze_at
    - item: Founder Decision 模板
      owner_package: 不做
      constraint: 沿用既有 governance/founder_rulings/*.yaml 格式
    - item: candidate/m2 其余 24 个判据（B 类 6 ＋ C 类 18）
      owner_package: BR2 收口（B 类逐个重评）／无（C 类，支线不恢复 M2 评测基座）
      constraint: 一个都不迁入；重评只在 BR2 收口发生，不得提前
      source: DIYU-CBFSK-FOUNDER-BR0-START-001 article_2_candidate_m2（原文「其余 25 个留 deferred_items」）
      amended_by: >-
        EP00-FIX-2 裁决① —— check_sequential_registration 由 B 类提前迁为 A 类，
        延期数 25 → 24。原文的 25 是签署时的分类快照，本次重分类由 Founder 单独裁决，
        不是执行侧自行改动裁决数字。
    - item: README-MOD 跨分支编号冲突（br0/ep00 与 candidate/m2 并行占用 MOD-12、MOD-13）
      owner_package: 合并 candidate/m2 的那一包
      enforcement_reality: |
        check_sequential_registration 守的是「同一台账内序列唯一且连续」。
        两条分支各自单看均合法，因此它不会提前预警；
        只有在两份台账合入同一文件的那一刻才会当场拦下合并。
        这是正确行为，但不等于「已被守住」——合并方必须在合并前人工重编号，
        不得等判据报红再处理。
  already_in_prd_do_not_recreate:
    - Human Review 边界
    - 发布策略与人工审核在环（D-25）
    - Deliverable Superiority Test 协议（附录 I）

scope_freeze_rule:
  effective_from: FOUNDER_RULING_BR0_START_001_SIGNED
  rule: 本包范围自裁决书签署起冻结；此后新发现一律进 deferred_items，不回改本包、不新增子任务
  current_state: EFFECTIVE
  effective_since_ruling: DIYU-CBFSK-FOUNDER-BR0-START-001
  effective_since_date: "2026-08-15"
  effective_since_commit: 2133f74e66f6389aa7832613f522e759f0c699d5
  current_state_note: >-
    冻结已生效（A4）。EP00-FIX 收口补丁发生在签署之前，因此合法；此后任何新发现——
    包括审查中被指出的——一律进 deferred_items，不回改 BR0-EP00 范围、不新增子任务。
    Guardian 审查提出的**缺陷修复**不受此限：修缺陷不是扩范围，但修完必须留在本包既有范围内。

