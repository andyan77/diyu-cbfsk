# ---------------------------------------------------------------------------
# 一之五、M2 期确立的永久治理规则（EP00-FIX-2 裁决②）
# ---------------------------------------------------------------------------
permanent_governance_rules:
  scope_note: |
    以下规则在 M2 期间确立并声明「全项目长期生效」。其原文此前仅存在于未合并的
    candidate/m2 分支；本包将规则文本迁入 main 侧治理记录，使其在主干可援引。
    迁的是规则本身，不是它的执行判据。
  transcription_method: >-
    两条 text 由脚本自 candidate/m2 源文件 general_rule.statement 直取，未经手抄；
    可用 FIX2-07 的 diff 复算证明逐字相符。
  rules:
    - id: GR-GATE-01
      text: 任何现役门禁的摘除或降级均为独立治理动作，须 Founder 单独授权，永不作为其他任务的副作用。
      scope: 全项目长期生效
      source_file: governance/founder_rulings/DIYU-CBFSK-FOUNDER-M2-RESUME-AUTHORIZATION-001.yaml
      source_commit: 64530031c0d0fcbc82ee77e1487e41c8661c0298
      enforcement: MANUAL_FOUNDER_AUTHORIZATION_ONLY
      enforcement_note: |
        其执行判据 check_m2_gate_retirement_guard 实现绑定 M2 台账，归 C 类不迁。
        本条在 main 上无自动化强制，仅为可援引的书面规则。
        不得表述为「已由判据强制」。
    - id: GR-LINKED-01
      text: 凡「允许更新 X」自动包含仓库机制强制要求的联动登记项，不必逐次裁决，但须在报告中列明联动项。
      scope: 全项目长期生效
      source_file: governance/founder_rulings/DIYU-CBFSK-FOUNDER-M2-RESUME-AUTHORIZATION-001.yaml
      source_commit: 64530031c0d0fcbc82ee77e1487e41c8661c0298
      enforcement: MANUAL_FOUNDER_AUTHORIZATION_ONLY
      applied_in_this_package: >-
        本包新增第 25 个判据，连带要求 README 判据计数与列名同步、pin 重算、
        README-MOD-14 登记。依本条，这些联动登记项不必逐次裁决，但已在交付报告中列明。

# ---------------------------------------------------------------------------
# 一之六、现役门禁改动记录（GR-GATE-01 要求的独立治理动作）
# ---------------------------------------------------------------------------
active_gate_change_record:
  rule_invoked: GR-GATE-01
  rule_text_at: permanent_governance_rules.rules[GR-GATE-01]
  changes:
    - gate: 工具/check_prd_v1_2.py
      package: BR0-M1-PRE（合并前修复，非 BR0-EP00 范围内）
      founder_authorization: in_session_dispatch，2026-08-15，Founder 选定「改判据，改读 change_map」
      is_removal_or_downgrade: false
      what_changed: >-
        README lifecycle 断言此前同时要求 README 里出现字面串 prd_v1_2_effective: true。
        该字段的定义处是 PRD_v1.2_change_map.yaml 的 resulting_state，lifecycle_state()
        本就从那里现读——README 那一份是同一事实的第二个定义处（EQ-1）。
        EP00-02 依裁决 article_3_readme 删掉 README 状态块后，判据仍在量已经搬走的位置。
        现改为：状态位在真源上断言，README 只留它自己承载的标记（SIGNED / 归档目录 / 签署包编号）。
      why_not_a_downgrade: >-
        判据总数 62 → 63，不是减少。新增的那条读**未经强转的原值**并要求它是货真价实的布尔：
        bool("false") 是 True，字段若被写成字符串，整条生命周期判定会静默翻面——
        这个洞在改造前不存在断言。三段分支口径一字未动。
      reverse_injection_evidence:
        - 把真源字段改成字符串 "false" → FAIL「prd_v1_2_effective is a real boolean at its single source」→ 恢复后 PASS
        - 把 README 的 归档_v1.1/ 标记改掉 → FAIL「README lifecycle markers: missing=['归档_v1.1/']」→ 恢复后 PASS
    - gate: .github/workflows/secret-and-hidden-boundary.yml
      package: BR0-M1-PRE
      is_removal_or_downgrade: false
      what_changed: 检测器一字未改，扫描面一寸未缩
      what_actually_changed: >-
        改的是交付报告的措辞。报告里描述检测器能力的那句话把「STORE-A」与「凭证」连写，
        被检测器自己命中。选择改措辞而不是把报告加进排除面——排除面一扩，
        下次真泄露落在被排除路径里就检不出来了。

# ---------------------------------------------------------------------------
# 二、基线
# ---------------------------------------------------------------------------
baseline_commit: a5564e1a4455b6521ae3c5e0b15385052c86c867
baseline_commit_role: 本包开工时 main 的 HEAD；支线一切执行合同以此为编译基准
runtime_base_branch: main

candidate_m2:
  commit: 64530031c0d0fcbc82ee77e1487e41c8661c0298
  branch: candidate/m2
  status: SUSPENDED_REFERENCE
  role: 只读抽取源
  observed_in_this_package: 本包只以 `git show candidate/m2:<path>` 读取，未 merge、未 cherry-pick、未建工作树

tenant_contracts_absent_on_main: true  # 支线自建，不进 Ledger

reuse_policy:
  mode: SELECTIVE_BACKPORT
  meaning: >-
    逐个判据、逐个文件地评估后单独迁入，并在 main 上重建其依赖与登记册；
    不整支合并、不按目录整体拷贝。

not_allowed:
  - merge_candidate_m2
  - copy_hidden_assets
  - import_m2_product_state

# ---------------------------------------------------------------------------
# 三、candidate/m2 判据差集：28 个，逐个归类，不留空
# ---------------------------------------------------------------------------
checker_delta:
  total: 28
  deferred_total: 24
  deferred_total_note: >-
    延期数 ＝ B 类 6 ＋ C 类 18。此处是该数字的单一定义处；交付报告引用本字段，不另抄一遍。
    裁决 article_2 原文写的是 25（＝ B 类 7 ＋ C 类 18），那是签署当时的分类快照；
    EP00-FIX-2 裁决①把 check_sequential_registration 提前迁入后为 24。
  measurement_command: >-
    comm -13 <(git ls-tree -r --name-only main -- ci/checkers | sort)
    <(git ls-tree -r --name-only candidate/m2 -- ci/checkers | sort)
  evidence_level: runtime_verified

  class_a_backported_now:
    count: 4
    disposition: 本包迁入 main 并接入 ci/run_all_checks.py
    items:
      - checker: check_report_number_traceability
        why: 「报告里的计数数字必须追得到机器记录」是通用工程原则，与 M2 题域无关；支线自 BR0 起每包都出交付报告。
      - checker: check_founder_confirmation_binding
        why: 「Founder 确认类字段不得是裸布尔值」是治理通则；支线新增的每一个确认位都要受它约束。
      - checker: check_collect_derivation_discipline
        why: 「判据的事实源必须现场推导」是防假绿通则；M1 女装判据假绿即此类。
      - checker: check_sequential_registration
        why: 「顺序登记编号唯一且连续、最新一条排在最前、落地提交须是可解析的 40 位哈希」是通用登记纪律，与 M2 题域无关。
        reclassified_from: class_b_candidate_reevaluate_at_br2_closeout
        reclassified_by: EP00-FIX-2 裁决①（Founder，2026-08-15）
        reclassification_reason: >-
          B 类的判准原文是「到 BR2 收口时，该判据在支线上是否已经有真实被守护对象。有则迁入」。
          它今天就有：governance/baseline/founder_pinned_baseline.v0.1.yaml 内的 13 条
          README-MOD 登记项正是它的被守护对象。原分类的 why_deferred 写「守的是执行包顺序登记，
          支线 execution/ 无实例」——把被守对象认成了执行包登记面，而判据实际读的是
          active_baseline_candidates[].authorized_modification_history。
          分类结果与判准自相矛盾，属缺陷，非新增范围。
        migration_cost_evidence: >-
          实测依赖仅 ROOT / cli / is_full_commit_hash / load_yaml / sha256_text，
          五个全部已在 main 的 ci/checkers/_common.py 中存在，_common.py 零改动；
          不含 EP00-04 三判据所需的 clause_resolves 家族；无需新建任何登记册。
        landed_defects: >-
          迁入当场判红 11 条——founder_pinned_baseline 的 13 条 README-MOD 中有 11 条
          landed_in_commit 写的是 M1_EP03_CLOSEOUT_COMMIT 这类符号名。全部按
          landed_in_commit_resolution 复算为 40 位哈希，未放宽任何断言。

  class_b_candidate_reevaluate_at_br2_closeout:
    count: 6
    count_note: >-
      原为 7。EP00-FIX-2 裁决①把 check_sequential_registration 提前迁为 A 类后减一，
      理由见 class_a_backported_now 内该条的 reclassification_reason。
    disposition: 不在本包迁入；BR2 收口时逐个重评
    reevaluation_point: BR2 收口（BR2-EP0n 终检，先于 BR3 开工）
    reevaluation_criterion: >-
      到 BR2 收口时，该判据在支线上是否已经有真实被守护对象。有则迁入并重建登记册；
      没有则继续挂起，不为「资产复用」空迁。
    items:
      - checker: check_identifier_resolution
        why_deferred: 支线标识体系（TenantContext / 22 张客户表主键）在 BR1—BR2 才成形，现在迁入无解析对象。
      - checker: check_stop_code_enforcement
        why_deferred: 依赖 stop_code_enforcement_registry；支线停机码在 BR2 安全边界包才定义。
      - checker: check_disclosure_discipline
        why_deferred: 与 M2 分发包 pack_manifest 强耦合；支线无分发包形态。
      - checker: check_guardian_report_binding
        why_deferred: 依赖 guardian_report_registry；main 上没有该登记册，且支线 Guardian 审查周期尚未开始。
      - checker: check_milestone_closure_coverage
        why_deferred: 依赖 milestone_closure_coverage_rule；支线里程碑（BR0—BR8）收口口径在 BR0-EP02 之后才稳定。
      - checker: check_error_code_fixture_coverage
        why_deferred: 守的是错误码与夹具的覆盖关系；支线运行时错误码在 BR1-EP02 之后才存在。

  class_c_not_backported:
    count: 18
    disposition: DEFERRED_NOT_BACKPORTED —— 不迁入，按裁决 article_2 留在 deferred_items
    disposition_note: >-
      「留 deferred」不等于「已废弃」：支线不恢复 M2 评测基座，因此预期它们长期不被迁入；
      但 M2 若被 Founder 另行裁决恢复，这 18 个仍是那时的现成资产，不因本裁决而失效。
    reason: >-
      17 个 check_m2_* 判据守的是 M2 评测基座自身的对象（锦标赛、评分卡、隐藏资产、
      封存印记、主线状态守卫等），支线不建评测平台；check_calibration_launch_pack 守
      校准包发射条件，同源。迁入即等于把 M2 产品状态带进 main。
    items:
      - check_m2_calibration_review
      - check_m2_calibration_set
      - check_m2_capability_matrix
      - check_m2_cross_package_consistency
      - check_m2_deliverable_closure
      - check_m2_envelope_contract
      - check_m2_evaluation_governance
      - check_m2_gate_retirement_guard
      - check_m2_governance_landing
      - check_m2_hidden_assets
      - check_m2_hidden_generation_readiness
      - check_m2_identity_isolation
      - check_m2_main_state_guard
      - check_m2_predistribution_sequence
      - check_m2_scoring_cards
      - check_m2_suspension_seal
      - check_m2_tournament
      - check_calibration_launch_pack
    note_identity_isolation: >-
      check_m2_identity_isolation 不迁入，但它守的红线（五项人脸识别能力永不建设）
      由 ADR-004 以原则形式迁移，见 m2_adr_classification；BR5 视觉包必须继承该红线。
      判据本身留在 M2，是因为它读的是 M2 的能力登记与依赖清单，支线上没有那些对象。

# ---------------------------------------------------------------------------
# 四、M2 ADR 六份：只分类，不搬运
# ---------------------------------------------------------------------------
m2_adr_classification:
  source_dir_on_candidate_m2: 03_m2_evaluation_foundation/adr/
  action: CLASSIFY_ONLY
  action_note: 本包不复制任何 ADR 文件到 main；下方结论是分类，不是搬运记录。

  verified_general_principle_migrate:
    count: 4
    meaning: 结论已被验证为跨里程碑通用；支线继承其**原则**，不继承其文件与 M2 期设定。
    items:
      - adr: ADR-002
        title: Model Provider Abstraction
        overlaps: BR1-EP03
        principle_inherited: 任何调用模型的位置只依赖模型无关合同，且必须声明 provider / model_id / model_version 并写入决策记录。
        why: >-
          与 v0.3.2 的 D-PROVIDER-USAGE 同向且更弱——后者进一步要求逐次 ModelCall 记 token 与
          estimated_cost。原则可直接继承；ADR-002 的「不选型、不接供应商」在支线 BR1-EP03
          已被真实 Provider 调用取代，故只迁原则不迁边界。
      - adr: ADR-003
        title: Tenant/Scope 与 M1→M2 组合消费
        overlaps: BR2-EP01
        principle_inherited: >-
          下游只能以组合式引用消费上游冻结物，in_place_modification_allowed 恒为 false。
        why: >-
          组合消费与禁止原位修改是通用工程原则，支线 ArtifactLineage / ContentNodeRef 直接沿用。
          但该 ADR 的租户设定条款已被推翻，见 clause_level_obsolescence。
      - adr: ADR-004
        title: 隐私与身份隔离
        overlaps: BR5（视觉）
        principle_inherited: >-
          五项人脸识别能力（1:N 识别、1:1 验证、持久化人脸特征向量、生物识别模板存储、
          跨会话面部关联）activation_condition = NEVER，红线，永不退役。
        why: >-
          红线级结论，与里程碑无关。支线 BR5 视觉条件包一旦启动即直接受其约束，
          不得因为「支线是新分支」而重新讨论。
      - adr: ADR-006
        title: Canonical Connector 边界
        overlaps: BR2-EP01
        principle_inherited: >-
          所有对外连接只经具名 Adapter，Adapter 必须声明方向、作用域、事实优先级归属与失败状态。
        why: >-
          支线 BR1 起就要接 Provider、BR7 起要接发布平台（首个平台＝视频号）。
          这条边界如果不先继承，连接器会长在业务代码里。

  retain_for_future_reference:
    count: 2
    meaning: 结论本身没错，但守的是 M2 评测基座的对象；支线不建该基座，故不继承、也不废弃。
    items:
      - adr: ADR-001
        title: 六层架构与边界
        why: >-
          六层是 M2 评测基座的分层口径。支线 v0.3.2 用的是自己的 BR0—BR8 模块划分，
          两套分层并存会造成「同一功能两套实现」（EQ-1）。M2 恢复时该 ADR 仍然有效，
          因此保留而不废弃。
      - adr: ADR-005
        title: 评测锦标赛与最小可观测性
        why: >-
          支线的功能价值判定是 Deliverable Superiority Test——人工盲评、无加权总分、
          且 v0.3.2 明文禁止建 A/B Runner、Evaluation Console、自动打分器。
          四维度锦标赛指标属 M2 资产，支线不消费。M2 恢复时仍有效。

  obsolete_retired:
    count: 0
    note: >-
      六份 ADR 没有整份过时的。ADR-003 的租户条款单条过时，按条款级记录在
      clause_level_obsolescence，不因此把整份 ADR 判废——那会连带丢掉仍然成立的组合消费原则。

  clause_level_obsolescence:
    - adr: ADR-003
      clause: SINGLE_TENANT_M2 / 「多租户数据隔离实现」列入 not_building_now / 「scope 字段只记录，不驱动任何隔离逻辑」
      status: SUPERSEDED
      superseded_by: v0.3.2 D-TENANT-DAY1
      superseding_rule: >-
        每一张归属客户的表自建表第一天起就带 tenant_id NOT NULL，品牌域表带
        FOREIGN KEY (tenant_id, brand_id) REFERENCES brands (tenant_id, brand_id)；
        不做「先建后补」。BR1 最低要求＝服务端产出 TenantContext ＋ 租户作用域 ＋
        tenant_id NOT NULL ＋ 品牌复合外键 ＋ 对象存储租户前缀。
      why_it_matters: >-
        若按 ADR-003 原文推进，支线会先建单租户表、再在 BR2 做一次「为既有客户表批量补
        tenant_id」的大迁移——而 D-TENANT-DAY1 明文禁止该迁移。两者不可并存，必须在
        BR0 就判定谁作废，不能留到 BR2 现场再吵。

# ---------------------------------------------------------------------------
# 五、交接给 BR0-EP02 的强制约束
# ---------------------------------------------------------------------------
br0_ep01_requirements:
  runtime_test_capability:
    pytest_skeleton_required: true
    minimum_real_test_count: 1        # 针对 /healthz 与首个 migration，接入新 workflow
  baseline:
    use_candidate_commit_from_BR0_EP00: true
  migration:
    tenant_id_not_null_from_first_customer_table: true
  execution_contract:
    jit_compiled_from_ep00_candidate_commit: true

  why_pytest_is_mandatory: >-
    本包交付后 main 上共 25 个确定性判据，全部读 YAML / DOCX / Markdown，
    对运行时代码结构性失明。不加 pytest 这一条，BR0 之后「CI 全绿」关于功能正确性一个字也没说。
  migration_detail:
    scope: v0.3.2 D-TENANT-DAY1 点名的客户所属对象
    composite_fk: 品牌域表带 FOREIGN KEY (tenant_id, brand_id) REFERENCES brands (tenant_id, brand_id)
    explicitly_not_required: 全表 RLS（BR1 不要求）
    explicitly_forbidden: 先建表后批量补 tenant_id 的迁移
    no_mechanical_brand_id_expansion: >-
      Tenant / TenantMembership / Tenant 级 Settings / 无品牌语义的 Tenant 级审计事件
      一律不加 brand_id。
  sequencing:
    - BR0-EP00 交付并经 Founder 接受
    - Founder 签署《BR0 启动裁决书 v0.1》（A1—A5）→ 范围冻结生效
    - Guardian 审 PR → 合并 main
    - 基于合并后的 candidate_commit JIT 编译 BR0-EP01 Runtime Skeleton 执行合同
    - v0.2 里的「BR0-EP01 合同收敛与复用边界」已整包并入本包 EP00-05，不再单独成包
  not_in_scope_for_ep01:
    - STORE-A 证明链（隐藏评测前置，不是支线开工前置）
    - 任何 B / C 类判据迁入
    - 任何 M2 产品资产导入


# ---------------------------------------------------------------------------
# 六、失败状态
# ---------------------------------------------------------------------------
failure_states:
  - BRANCH_BASELINE_COMMIT_DRIFT: baseline_commit 与实际编译基准不一致
  - CHECKER_DELTA_COUNT_MISSTATED: 三类计数之和不等于 checker_delta.total
  - M2_ASSET_IMPORTED: C 类判据或 M2 产品资产出现在 main
  - EP01_COMPILED_BEFORE_EP00_ACCEPTED: BR0-EP01 执行合同在本包被接受前冻结
