      refinement: >-
        原文写「仅 3 个判据回迁；其余 25 个留 deferred_items」。本文件的 checker_delta 把延期的那批
        再分成 B 类（BR2 收口逐个重评）与 C 类（支线不恢复 M2 评测基座，预期长期留在 deferred）。
        这是**怎么 defer** 的细化，不是改变「留 deferred_items」这个裁决。
      amended_by_ruling: >-
        EP00-FIX-2 裁决①（Founder，2026-08-15）：check_sequential_registration 由 B 类提前迁为
        A 类，回迁数 3 → 4、延期数 25 → 24。原文的 3 与 25 是签署当时的分类快照；
        改动它们的是 Founder 的后一次裁决，不是执行侧自行调数。裁决书本体一字未改。
