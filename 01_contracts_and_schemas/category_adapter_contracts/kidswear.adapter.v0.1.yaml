category_id: CAT-KIDSWEAR
category_name: 童装
core_audience: 儿童与家长双重决策者
unique_professional_contract: [年龄与发育, 活动自由, 穿脱便利, 面料触感, 安全, 耐洗, 成长余量]
forbidden: [成人化身体评价]
