  inherits_note: 童装硬约束自成一套，不由女装规则派生；共享的只有通用专家机制。

hard_constraints:
  - id: KW-HC-01
    statement: 不得使用成人化身体评价。
    prd_anchor: PRD-4.1 CAT-KIDSWEAR.forbidden / PRD-9.4
    severity: safety_critical
    failure_state: CATEGORY_SAFETY_VIOLATION
  - id: KW-HC-02
    statement: 年龄与场景不明时不得输出可能不适龄、成人化或安全风险较高的建议。
    prd_anchor: PRD-6.4
    severity: safety_critical
    fail_closed_ref: FC-05
    failure_state: AGE_CONTEXT_INSUFFICIENT
  - id: KW-HC-03
    statement: 安全相关属性（绳带、小部件、明火阻燃、成分与安全认证）不得由视觉推断得出，只能取权威结构化商品事实。
    prd_anchor: PRD-5.6 / D-23 / NG-08
    severity: safety_critical
    failure_state: MULTIMODAL_ATTRIBUTE_UNSAFE
  - id: KW-HC-04
    statement: 活动自由、穿脱便利、面料触感、耐洗与成长余量属本品类必判维度，缺失即失败关闭，不得以外观替代。
    prd_anchor: PRD-4.1 CAT-KIDSWEAR.unique_professional_contract
    severity: safety_critical
    fail_closed_ref: FC-05
    failure_state: AGE_CONTEXT_INSUFFICIENT
  - id: KW-HC-05
    statement: 面向家长与面向儿童的表达都不得制造消费焦虑或以同伴比较施压。
    prd_anchor: PRD-9.4
    failure_state: BODY_EXPRESSION_VIOLATION

safety_boundary:
  age_appropriateness: 按年龄段与发育阶段判断；未满 14 周岁涉及个体档案时须监护人同意（与 individual_profile 双模式合同联动）。
  body_expression: 禁止任何成人化身体评价、身体羞耻与外貌排名。
  performance_claims: 不得承诺安全性能；安全认证只能引用权威事实。
  serving_stop: 安全硬门失败 → 本品类立即关闭 Serving。

fail_closed_bindings: [FC-05]
stop_condition_bindings: [SC-06]
founder_review:
