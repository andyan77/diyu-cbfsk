    - {item: 分场景时延目标, node: M6 冻结, owner: 产品负责人提案 + Founder 裁决, mark: 建议默认}
    - {item: 隐藏品牌合成细则, node: M0 合同 → M2 冻结, owner: Guardian 侧 + Founder 确认}
    - {item: 真实品牌补验批次启动, node: 首个真实品牌接入时, owner: FOUNDER_PRODUCT_AUTHORITY, mark: 建议默认}
    - {item: Founder 真实品牌注入, node: M11 试点基线冻结前, owner: FOUNDER_PRODUCT_AUTHORITY, fallback: 未提供即自动回退 Codex 夹具合成，不阻断 M11}
    - {item: 发布模式, node: 每个品牌/租户/账号/内容类型首次启用自动发布前, owner: FOUNDER_PRODUCT_AUTHORITY, default_if_undecided: human_review}
    - {item: VisualMerchandisingExtensionPort, node: Founder 提出空间陈列产品化需求时另立 Brief, ruling: D-22}
