deferred_decision_nodes:
  prd_anchor: PRD-15.6
  items:
    - {item: 生产模型最终选型, node: M12 生产加固前, owner: FOUNDER_PRODUCT_AUTHORITY, linkage: 境外 API 处理个体资料须先过 CMP-03}
    - {item: 试点三品类选定, node: M10 通过后、M11 启动前, owner: FOUNDER_PRODUCT_AUTHORITY}
    - {item: 商业 KPI 口径与阈值, node: M11 试点基线冻结时, owner: FOUNDER_PRODUCT_AUTHORITY, constraint: 三层信号分离呈现（R-10）}
    - item: 限额 POC 证据批次额度
      node: M0 冻结时
      owner: FOUNDER_PRODUCT_AUTHORITY
      status: DECIDED
      decision_ref: DIYU-CBFSK-FOUNDER-M0-DECISION-001 第二条
      decision_date: "2026-08-13"
      decision: 确认 PRD 15.1 建议默认额度
      quota:
        scenario_instances_max: 500
        candidate_answers_max: 2000
        expert_sampled_review_min: 100
        effort_cap_person_months: 6
      quota_is_a_ceiling: true
