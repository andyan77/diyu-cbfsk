publication_governance:
  ruling_id: D-25
  default_mode: human_review
  auto_publish_requires: [Founder 按租户/品牌/账号/风险级别显式授权, 全部前置检查通过, 审计, 撤回, 回滚, Kill Switch]
  hard_gate: unauthorized_auto_publish_rate = 0
  unchanged: [FR-17 可售性复核, 人工可发布率 ≥75%]
  m0_state: {publication_mode: human_review, auto_publish_enabled: false}

high_risk_review_coverage:
  prd_anchor: PRD-10.3
  rate: "100%"
  no_sampling_allowed_for: [童装安全, 青少年身体与年龄适当性, 运动功能安全, 隐私与个人信息, 品牌硬规则, 法律/医疗/性能承诺]
  medium_low_risk: 允许 Founder 分层抽样 + 多个隔离 AI 评审 + 确定性 Checker 组合

safety_and_compliance_gate:
  prd_anchor: PRD-10.4 八道门之一
  covers: [品类安全, 隐私与授权, AIGC 标识, 未成年人信息, 数据出境, 商品图片权利与保密, 自动发布授权]

obligations:
  - id: OB-CMPL-01
    statement: 七项合规问题必须逐项裁决，不得用一次笼统自评替代。
    required_inputs: [七项核验清单, Founder 裁决文本]
    outputs: [founder_compliance_decision_ledger 七条记录]
    failure_state: BLANKET_SELF_ASSESSMENT
    owner_role: FOUNDER_PRODUCT_AUTHORITY
    prd_anchor: PRD-10.4
  - id: OB-CMPL-02
    statement: 任何裁决为 ACCEPT/MITIGATE/DEFER/BLOCK 时必须同时记录理由与裁决日期；DEFER 不得写成 ACCEPT。
    required_inputs: [裁决值, 理由, 日期]
    outputs: [台账 rationale / decision_date 字段]
    failure_state: DECISION_WITHOUT_RATIONALE
    owner_role: FOUNDER_PRODUCT_AUTHORITY
    prd_anchor: PRD-10.4
  - id: OB-CMPL-03
    statement: external_legal_opinion_obtained 必须如实为 false；不得把 Founder 自评或 AI 意见表述为法律意见。
    required_inputs: [法律评审实际状态]
    outputs: [external_legal_opinion_obtained 字段, 评审声明用语]
    failure_state: UNSUPPORTED_LEGAL_OPINION_CLAIM
    owner_role: FOUNDER_PRODUCT_AUTHORITY
    prd_anchor: PRD-10.4
  - id: OB-CMPL-04
    statement: 高风险知识 Founder 审查覆盖率必须为 100%，不得抽样。
    required_inputs: [知识风险分级结果]
    outputs: [high_risk_founder_full_review_rate 数值]
    failure_state: HIGH_RISK_SAMPLED
    owner_role: FOUNDER_PRODUCT_AUTHORITY
    prd_anchor: PRD-10.3 / PRD-10.2
  - id: OB-CMPL-05
    statement: 每个后置事项都必须有责任人与截止节点，不得存在无人负责或无节点状态。
    required_inputs: [PRD-15.6 后置事项表]
    outputs: [deferred_decision_nodes.items]
    failure_state: DEFERRED_ITEM_WITHOUT_OWNER_OR_NODE
    owner_role: FOUNDER_PRODUCT_AUTHORITY
    prd_anchor: PRD-15.6
  - id: OB-CMPL-06
    statement: publication_mode 默认 human_review；未经 Founder 授权不得启用自动发布，违反即触发 Kill Switch。
    required_inputs: [PublicationPolicy, Founder 授权记录]
    outputs: [PublicationDecision, Kill Switch 记录]
    failure_state: UNAUTHORIZED_AUTO_PUBLISH
    owner_role: FOUNDER_PRODUCT_AUTHORITY
    prd_anchor: D-25 / FR-28 / PRD-16.2 SC-11
