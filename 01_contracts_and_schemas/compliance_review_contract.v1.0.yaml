  ledger: governance/compliance/founder_compliance_decision_ledger.yaml
  checker: ci/checkers/check_compliance_ledger.py

checklist:
  count: 7
  count_is_frozen_for_first_round: true
  prd_anchor: PRD-10.4 ①—⑦
  items:
    - {id: CMP-01, issue: 未满 14 周岁个人信息与监护人同意机制, law: 个人信息保护法, applicable_stage: M0/M1/M9/M12, trigger: 童装与青少年为首发品类，直接触发}
    - {id: CMP-02, issue: AI 生成合成内容标识义务与各平台 AIGC 标注规则, law: 人工智能生成合成内容标识办法, applicable_stage: M7/M12, trigger: 账号矩阵批量发布场景}
    - {id: CMP-03, issue: 数据出境路径核验, law: 促进和规范数据跨境流动规定, applicable_stage: M3/M4/M12, trigger: 任何环节使用境外模型 API 处理个体资料}
    - {id: CMP-04, issue: 面向公众提供生成式 AI 服务的备案适用性, applicable_stage: M12, trigger: 取决于最终产品形态，形态裁决后核验}
    - {id: CMP-05, issue: 模型厂商服务条款对知识蒸馏用途的约束, applicable_stage: M3/M4/M5, trigger: GPT×Claude 蒸馏链，核验一次并留档}
    - {id: CMP-06, issue: 完整顾客档案模式的敏感信息处理、保存期限与删除权流程, law: 网络数据安全管理条例, applicable_stage: M9/M12, note: 含「去标识化≠匿名化」认定}
    - {id: CMP-07, issue: Founder 或品牌提供的商品图片使用权、保密义务、保存期限、模型处理与输出公开范围, applicable_stage: M11/M12}

