      - {id: CMP-01, decision: DEFER, gate: M2_FREEZE, node: M2 冻结前完成 Founder 合规自评}
      - {id: CMP-02, decision: DEFER, gate: M2_FREEZE, node: M2 冻结前完成 Founder 合规自评}
      - {id: CMP-03, decision: DEFER, gate: M2_FREEZE, node: M2 冻结前完成 Founder 合规自评}
      - {id: CMP-04, decision: DEFER, gate: PRODUCT_FORM_RULING, node: 产品形态裁决后}
      - {id: CMP-05, decision: DEFER, gate: M4_DISTILLATION_START, node: M4 蒸馏开跑前核验一次}
      - {id: CMP-06, decision: DEFER, gate: M2_FREEZE, node: M2 冻结前完成 Founder 合规自评}
