bundle_compatibility:
  prd_anchor: PRD-5.7 / NFR-11
  bundle_schema_id: https://diyu-cbfsk.local/m1/StylingResultBundle.schema.v0.1.json
  slot_property: backward_compatible_extension_ports
  slot_kind: 可选数组，取值限定为已登记端口 id
  rules:
    - 扩展只能以**新增**方式开启：新增可选属性、新增 $defs、新增端口枚举成员。
    - 端口未开启时，Bundle 的既有必填字段集与既有消费者行为不得改变（NFR-11）。
    - 旧版消费者读到未知端口 id 时按忽略处理，不得因此判整包非法。
    - 端口不得绕过安全、授权与库存门；扩展路径与主路径共用同一套门。
  forbidden_changes:
    - 删除或改名 Bundle 既有属性
    - 把既有可选属性改为必填
    - 收窄既有枚举或数值域
    - 让端口开启后跳过品类安全硬约束、发布授权或库存真实性检查
  failure_state: EXTENSION_PORT_COMPATIBILITY_BROKEN
  stop_condition_ref: SC-15

versioning:
  registry_component: CMP-19 ExtensionPortRegistry
  rule: 端口独立版本化；端口版本变化不强制 Bundle 主版本变化，但破坏兼容的变更一律不允许（只能新开端口版本）。
  current_versions:
    VisualMerchandisingExtensionPort: "0.1"
    RealtimeSalesAssistExtensionPort: "0.1"

obligation_ref:
  id: OB-ARCH-05
  file: 01_contracts_and_schemas/architecture_and_integration_boundary.v1.0.yaml
  statement_verbatim: 扩展端口必须版本化且向后兼容，未开启时不破坏现有输出，也不得绕过安全、授权与库存门。

m1_scope_note: >-
  M1 只交付端口合同本身。不实现任一端口的业务能力，不为预留对象建 Schema，
  不创建 Serving，不接入真实库存或真实顾客。
