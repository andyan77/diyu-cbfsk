handoff_to_m2:
  dependency: DEP-02：M1 对象稳定后才可冻结引用它们的评分卡。
  bind_by: schema_id（不是文件名，不是标题）
  what_m2_may_now_freeze:
  - 引用上述 schema_id 的评分卡字段
  - 引用上述 hard_constraint_ids 的硬门映射
  - 引用上述 dimension_ids 的风格坐标覆盖设计
  what_m2_must_not_do:
  - 为 ②③ 类任务设置唯一 Gold Answer（SC-20 / D-28；M1 未改变该口径）
  - 把 RESERVED_NOT_IMPLEMENTED 端口写成可评测能力
  - 在 M1 对象未稳定时冻结引用它们的评分卡
  - 把内部评审面板结论写成外部专家结论
  m1_did_not_change:
  - M2 的 18 项交付清单
  - PRD 10.2 的阈值与 M2_FREEZE_REQUIRED 范围
  - D-28 三分类与可接受决策边界口径
  - 高风险 Founder 全审覆盖率 100% 不可抽样
handoff_to_m3:
  dependency: DEP-03：M3 → M4，Claude Code 只执行经预审的问题包，不自由扩写范围。
  status: INTERFACE_ONLY
  why_interface_only: 仓内不存在 M3 问题系统 Brief（M0 十四项交付物不含它）。本文件只交接 M1 已产出的对象与约束 ID；M3 的题型、范围、批次与开放题模板属 M3 规划，未获授权，M1 不代为设计。
  what_m3_may_reference:
  - 上述 schema_id 作为题面输入/输出对象
  - 上述 safety_critical_constraint_ids 作为硬约束题（constraint_correctness）的判定依据
  - 上述 conflict_priority_rule_ids 作为跨品类冲突题的正确性依据
  what_m3_must_not_do:
  - 为 mechanism_correctness 或 open_decision 类题设置唯一 Gold Answer（SC-20）
  - 就 RESERVED_NOT_IMPLEMENTED 端口出题
  - 引用 M1 未产出的对象或自造品类约束描述
