schema_version: '0.1'
artifact_id: pinned_reuse_ledger.v0.1
contract_id: DIYU-CBFSK-PINNED-REUSE-LEDGER-001
project_id: DIYU-CBFSK-001
established_at_package: BR0-EP00
purpose: >-
  知道复用了什么。仅此而已——本台账不是资产管理平台，没有生命周期、没有审批流、没有服务。
  它回答一个问题：支线复用的这份资产，是哪一版的哪些字节。
  Git commit 只说明当时仓的状态，说明不了这个文件的字节，因此每条同时钉 40 位 commit 与
  文件 SHA-256，两者缺一即 FAIL。

rule:
  commit_is_not_file_hash: >-
    PRD v0.3.2 附录 A 的「来源」列写的是 commit，那是定位用的；本台账的 file_sha256 才是
    钉版本用的。附录 A 与本台账不一致时以本台账为准。
  every_entry_requires: [asset, source_path, source_commit, file_sha256]
  recompute_command: sha256sum <source_path>
  drift_meaning: >-
    file_sha256 对不上，说明被复用的那份资产在支线开工后变过。这不自动等于错误，
    但必须由对应 BR 包重新评估兼容性并更新本台账，不得默默沿用。

coverage:
  from_milestone: BR0
  to_milestone: BR6
  coverage_rule: >-
    只覆盖 BR0—BR6 会真正用到的关键合同，不覆盖 01_contracts_and_schemas/ 全部 43 个文件。
  groups_covered: [ProductTruth, Inventory, Tenant, Persona, PlatformProfile, PublicationPolicy, Compliance, KnowledgeState, NonGoals]
  tenant_group_note: >-
    本仓 M0/M1 没有独立的 Tenant 合同——租户根是支线 v0.3.2 D-TENANT-DAY1 在 BR1 新建的对象。
    Tenant 组因此只登记上游约束（架构与集成边界，含凭据边界），不假装存在一份 Tenant 合同。
  source_of_entries: PRD v0.3.2 附录 A｜建议复用的 M0/M1 资产映射（本包由 14 行补至 29 行）
  entries_equal_appendix_a_rows: 29
  deferred_to_later: >-
    BR7（Pilot）与 BR8 的复用面依赖真实品牌与真实平台账号，届时另行登记。

