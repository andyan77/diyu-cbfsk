contract:
  purpose: ADR-001 六层架构的落地件——把 M1 冻结的 12 输入与 15 输出对象逐一归到层。
  ground_truth: 01_contracts_and_schemas/m1_object_model/object_coverage_map.v0.1.yaml
  ground_truth_rule: >-
    对象清单以 M1 覆盖映射表为准，本表不得增删对象。check_m2_governance_landing 从覆盖映射表
    独立取 object_id 集合，双向比对本表——本表多一个是凭空造对象，少一个是漏映射，两个方向都判失败。
  m1_objects_modified: false
  m1_objects_modified_note: 本表只做归属标注，不打开任何 M1 Schema 文件写入。

layers:
  - layer_id: knowledge_layer
    name: 知识层
    domain_side: domain_core
  - layer_id: domain_core
    name: 领域内核层
    domain_side: domain_core
  - layer_id: persona_plane
    name: 人设平面
    domain_side: domain_core
  - layer_id: narrative_plane
    name: 叙事平面
    domain_side: domain_core
  - layer_id: delivery_surface
    name: 交付面
    domain_side: delivery_surface
  - layer_id: evaluation_and_governance
    name: 评测与治理层
    domain_side: cross_cutting

domain_boundary:
  line_between: [narrative_plane, delivery_surface]
  meaning: L1—L4 判断「什么是对的、由谁以什么口吻说」；L5 决定「以什么形态送出去」。
  content_first_api_second: 内容与 API 都只是 delivery_surface 的交付形态，不是两套系统。

knowledge_layer_note:
  m1_object_count: 0
  statement: >-
    知识层在 M1 对象层**没有**落点，这是如实状态不是遗漏：其载体是 M0 冻结的
    knowledge_state_machine.v1.0.yaml 里的 13 类知识单元与七级状态链，
    M1-EP01 只做搭配输入输出对象的 Schema 化。M2 不为补齐映射而新造 M1 对象
    （那会触发 NEW_TOP_LEVEL_INPUT_OR_OUTPUT_OBJECT_REQUIRED 熔断）。

