fact_priority_unchanged:
  statement: >-
    分层不引入第二套事实优先级。七级优先级仍由 common_defs.schema.v0.1.json#/definitions/factPriorityLevel
    单独定义；persona_plane 与 narrative_plane 均不得覆盖 domain_core 的品牌真源与品类硬约束。
  source_of_truth: 01_contracts_and_schemas/m1_object_model/common_defs.schema.v0.1.json#/definitions/factPriorityLevel
