schema_version: '0.1'
contract_id: DIYU-CBFSK-M2-FOUNDER-BOUNDARY-ANCHOR-TRUTH
artifact_id: founder_boundary_anchor_truth.v0.1
project_id: DIYU-CBFSK-001
milestone: M2
execution_package: M2-EP05-CORRECTION
status: DRAFTED_PENDING_FOUNDER_CONFIRMATION
artifact_lifecycle_state: validated
established_by: DIYU-CBFSK-FOUNDER-M2-EP05-CORRECTION-001 article_c1_calibration_pack_needs_object_under_review
what_this_file_is:
  holds: 每个候选输出被构造时落在接受边界的哪一侧
  is_not: 评审员应当给出的正确答案
  why_the_distinction_matters: 这里记的是构造事实——候选输出是照着「落在界内」还是「明确越界」写出来的，写的人知道自己写的是哪一侧。评审员判得跟它不一致，可能是评审员读错了边界，也可能是这条边界本身写得不清楚。两种情形都要靠回收后的分歧统计去分，不能因为这里有一列标签就把它当成对错判定。
distribution:
  distributed_to_reviewers: false
  must_not_enter_distribution_pack: true
  why: 标签一旦随包发出去，测的就是评审员抄标签的能力。
  enforced_by: ci/checkers/check_calibration_launch_pack.py
  failure_state: PACK_CONTAINS_ANCHOR_LABEL
founder_confirmation:
  confirmed: false
  confirmed_by: null
  confirmed_at: null
  confirmed_at_commit: null
  ruling_ref: null
  clause_path: null
  execution_side_must_not_fill: true
  binding_rule: DIYU-CBFSK-FOUNDER-M2-EP05-CORRECTION-001 article_c7_founder_confirmation_fields_general_rule
  note: 本文件由执行侧起草；在 Founder 确认之前，它是构造记录，不是 Founder 锚点定论。
assignment_rule:
  statement: 45 个格子按其在校准集中首次出现的顺序编号；格序为偶数时该格第一例为 inside，为奇数时该格第二例为 inside。
  why_not_uniform: 若 inside 恒定落在每格第一例，评审员按 case_id 的奇偶就能猜出答案，测出来的一致率是猜规律的能力，不是读边界的能力。
  recomputed_by_checker: true
  failure_state: ANCHOR_ASSIGNMENT_RULE_VIOLATED
boundary_position_vocabulary:
  inside: 照着落在该例接受边界之内构造。
  outside: 照着明确越过该例接受边界构造。
  boundary_high_value: 照着紧贴边界、争议价值高的位置构造。
boundary_high_value_not_used_this_round:
  used: false
  why: 裁决给了「明确越界」与「高价值边界位置」两个选项。本轮全部取明确越界：首轮要回答的是两位评审员读同一条边界读不读得一样，紧贴边界的候选会把「读法不同」和「这条边界本身就写得含糊」混在一起，首轮分不开这两者。等首轮拿到分歧分布，再决定第二轮要不要往边界上压。
  may_be_used_in_later_rounds: true
compliance_rate_definition:
  two_rates_computed_on_recovery:
  - 两侧一致率
  - 对已冻结边界的符合率
  agreement_rate: 两侧 judgment 相同的评审单元占比。与本文件无关，只看两侧记录。
  boundary_compliance_rate: 某一侧 judgment 与本文件 constructed_judgment 相同的评审单元占比。
  must_not_be_stated_as:
  - 评审员正确率
  - 评审员准确率
  - 产品能力基线
  why: 符合率低有两种读法——评审员读错了边界，或这条边界写得不清楚。叫它「正确率」等于先把第二种读法排除掉。
