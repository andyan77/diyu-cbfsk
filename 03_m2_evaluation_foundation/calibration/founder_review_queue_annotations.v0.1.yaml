milestone: M2
execution_package: M2-EP06
status: DRAFTED_PENDING_FOUNDER_REVIEW
artifact_lifecycle_state: validated
established_by: DIYU-CBFSK-FOUNDER-M2-EP06-001 article_2_founder_review_queue

what_this_file_is:
  holds: 审阅队列里唯一由人写的四列——候选摘要、判定依据锚点、判定依据、执行侧自评把握度。
  is_not: 审阅队列本身。
  why_separate: >-
    队列的其余各列（品类、任务类型、风险等级、锚点判定）都能从校准集与锚点真源现场取出。
    把能取出的列也手写一遍，就会出现两套值，改一处漏一处。
    这里只留必须由人写的部分，队列由 ci/tools/build_founder_review_queue.py 派生，判据重新派生逐字节比对。
  consumer: ci/tools/build_founder_review_queue.py

visibility:
  side: founder_side
  must_not_enter_distribution_pack: true
  why: >-
    本文件与它派生出的队列都带着锚点判定（界内／越界）。这是候选被构造时落在边界哪一侧的答案，
    随包发出去，测的就是评审员抄标签的能力。
  enforced_by: ci/checkers/check_m2_predistribution_sequence.py
  failure_state: REVIEW_QUEUE_IN_DISTRIBUTION_PACK

authoring_confidence_vocabulary:
  high: 我认为称职的评审员会判到与构造侧相同的一侧。
  low: 我认为称职的评审员可以合理地判到相反的一侧。
  why_two_values_only: >-
    中间档没有可操作含义——「不太确定」既不改变队列里的行，也不给 Founder 任何可裁决的东西。
    这一列的用途只有一个：把「我自己也拿不准」的行挑出来给 Founder 重点看。

basis_rules:
  must_point_at: 被触发或未触发的具体硬门或边界条款
  must_not_be: 综合判断
  anchor_must_resolve_in_case: basis_anchor 必须是该例自己声明的 hard_gate_refs、constraint_ref 或 acceptable_decision_boundary_ref 之一。
  anchor_must_appear_in_text: judgment_basis 正文里必须出现 basis_anchor 本身，不得只在字段里写而正文泛泛而谈。
  candidate_summary_max_chars: 60
  judgment_basis_max_chars: 40
  failure_states:
  - REVIEW_QUEUE_BASIS_NOT_ANCHORED
  - REVIEW_QUEUE_BASIS_ANCHOR_UNRESOLVED
  - REVIEW_QUEUE_FIELD_TOO_LONG
  - REVIEW_QUEUE_BASIS_IS_GENERAL_JUDGEMENT

shared_questions:
  purpose: 同一个问题横跨多例时列在这里，Founder 裁一次即可覆盖全部相关行，不必逐行重复判断。
  items:
  - id: SQ-01
    question: 候选自述题干未给的品牌色彩硬规则（色卡归属、撞色上限、荧光面积上限），算「按 ADB-M-03 联合品牌色彩语法」还是算「编造品牌真源」？
    affects: [CAL-016, CAL-052, CAL-064, CAL-088]
    why_it_matters: >-
      ADB-M-03 要求推理必须联合品牌色彩语法，而这四例的题干都没有把品牌色卡写进去。
      候选要满足边界就得把它说出来；说出来又可能被读成凭空生成权威事实。
      四例构造侧都判了界内，若 Founder 认为应判界外，四例一起翻。
  - id: SQ-02
    question: 合法解族被题干列了三个视角，候选只写两个，算不算解族不足？
    affects: [CAL-072]
    why_it_matters: >-
      ADB-O-06 的可接受边界只要求「视角不同但专业结论必须一致」，没有要求覆盖全部视角，
      且该例题干场景本身只要两条帖子。但 legal_solution_families 列了三条，可能被读成下限。

