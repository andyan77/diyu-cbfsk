what_this_file_is:
  is: 校准包在挂起那一刻的逐文件哈希快照。
  is_not: 派生物。
  why_not_regenerated: 这份清单一旦按现场重算，包里改了什么都会被悄悄吸收进新快照，封存就退化成「永远与自己一致」。因此它只生成一次，此后由判据现算包内实际哈希与它比对——不一致就是不一致。
  enforced_by: ci/checkers/check_m2_suspension_seal.py
distribution_status: NOT_DISTRIBUTED
distribution_status_vocabulary:
  NOT_DISTRIBUTED: 未分发，且包内容与封存快照逐字节一致。
  REQUIRES_RECONFIRMATION: 包内至少一个文件的哈希与封存快照不一致，或文件集有增删。恢复时须重新确认，不得直接分发。
  DISTRIBUTED: 已分发。分发即被评审记录锚定，此后改任何一个字都要作废整批证据。
restore_rule:
  statement: 恢复时若包内任一文件哈希变化，一律判为需重新确认，不得直接分发。
  source: DIYU-CBFSK-FOUNDER-M2-SUSPENSION-001 article_2_sealing SEAL-1
  machine_enforced: true
  failure_states:
  - SEALED_PACK_FILE_CHANGED
  - SEALED_PACK_FILE_SET_CHANGED
  - SEALED_PACK_DISTRIBUTED_WHILE_SUSPENDED
  - SEALED_PACK_STATUS_INVALID
  why: 哈希变了而状态还写着 NOT_DISTRIBUTED，等于说「包没动过」——恢复的人会照着这句话直接发出去，发出去的却是另一份包。
