schema_version: '0.1'
contract_id: DIYU-CBFSK-M2-METRIC-REVIEW-UNIT-MAPPING
artifact_id: metric_review_unit_mapping.v0.1
project_id: DIYU-CBFSK-001
milestone: M2
execution_package: M2-EP05-CORRECTION
status: VALIDATED
artifact_lifecycle_state: validated
established_by: DIYU-CBFSK-FOUNDER-M2-EP05-CORRECTION-001 article_c4_threshold_evidence_typing
why_this_file_exists:
  verbatim_from_ruling: 两名评审员在 90 个边界题上达成一致，只能说明评分口径可理解，不能统计推导出人设一致性、语感、多模态等产品指标应取 0.82 还是 0.87。
  plain: 评审员校准和产品指标统计校准是两件事。前者问「两把尺子刻度一样吗」，后者问「这批产品的实测值分布在哪，及格线该划在哪」。本轮只做了前者；把前者的一致率当成后者的依据，是拿量尺子的结果去给产品定分数线。
evidence_kinds:
  POLICY_THRESHOLD:
    decided_by: FOUNDER_PRODUCT_AUTHORITY
    basis:
    - 商业风险
    - 误接受代价
    - PRD 建议值
    - 校准分歧
    must_not_be_disguised_as: 统计估计
    requires_estimator: false
    why: 它是产品裁决。装成统计估计，会让人以为那个数字是算出来的，从而不再追问是谁在什么代价假设下定的。
  EMPIRICAL_CUTPOINT:
    requires:
    - 真实候选输出
    - metric → review_unit 映射
    - estimator
    - minimum_sample_count
    - false_acceptance_policy
    - false_rejection_policy
    recomputed_by_checker_from_raw_records: true
    why: 只有当这条指标的观测值真的能从原始记录里算出来时，它才算经验切点。算不出来就不是。
counts:
  metrics: 34
  policy_threshold: 32
  empirical_cutpoint: 2
  empirical_with_inputs_available: 0
coverage_rule:
  statement: threshold_freeze_decision.v0.1 的每一条 metric 必须在本文件出现且仅出现一次，反之亦然。
  failure_states:
  - METRIC_MAPPING_MISSING
  - METRIC_MAPPING_UNKNOWN
  - METRIC_MAPPING_DUPLICATE
failure_states:
- METRIC_MAPPING_MISSING
- METRIC_MAPPING_UNKNOWN
