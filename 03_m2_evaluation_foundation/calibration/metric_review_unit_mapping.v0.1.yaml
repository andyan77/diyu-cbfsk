  false_acceptance_policy: 订得过松＝Founder 推翻很多也算正常，等于承认评审面板与产品判断长期不一致却不处理。
  false_rejection_policy: 订得过严＝把 Founder 的正常裁量当成异常，会压制推翻，反而让错误结论固化。
  why_empirical: 推翻率的观测值来自 Founder 对队列的实际处置记录，不是政策取值。
  review_unit_ids_note: 队列尚未生成，映射到的评审单元集合此刻为空——这不是漏写，是队列还不存在。
