schema_version: '0.1'
set_id: DIYU-CBFSK-M2-PUBLIC-CALIBRATION-SET
artifact_id: public_calibration_set.v0.1
project_id: DIYU-CBFSK-001
milestone: M2
execution_package: M2-EP04
status: M2_EP04_DELIVERED
artifact_lifecycle_state: validated
visibility: public
visibility_note: 本集合是公开校准集，不是隐藏评测集。它的用途是标定评审员，因此必须对评审员可见；隐藏集的用途是考模型，因此必须对生成链不可见。两者用途相反，不得互相顶替，也不得用本集合参与任何阈值调参之外的评测结论。
authority: DIYU-CBFSK-M2-CLOSEOUT-REPAIR-001 v1.1 第三节 A-3a
brief_anchor: 01_contracts_and_schemas/m2_evaluation_freeze_brief.md 第 2 节第 8 项（评审员校准）
grid:
  categories: 5
  evaluation_task_classes: 3
  risk_tiers: 3
  cells: 45
  cases_per_cell: 2
  total_cases: 90
  empty_cells: 0
  empty_cell_rule: 45 个格子无一为空；任一格为空即 STRATUM_EMPTY。
id_space_sources:
  category_id: 01_contracts_and_schemas/m1_interface_handoff.v0.1.yaml category_constraint_surface
  evaluation_task_class: 03_m2_evaluation_foundation/scoring/evaluation_task_class_contract.v0.1.yaml
  risk_tier: governance/bootstrap/role_operating_model.v0.2.yaml review_mode.risk_tiered_review
  capability_dimension: 03_m2_evaluation_foundation/capability_matrix/benchmark_capability_matrix.v0.1.yaml
  constraint_ref: 01_contracts_and_schemas/category_adapter_contracts/*.adapter.v0.1.yaml 与 cross_category_conflict_priority.v0.1.yaml
  acceptable_decision_boundary_ref: 03_m2_evaluation_foundation/scoring/acceptable_decision_boundary_registry.v0.1.yaml
  hard_gate_refs: 01_contracts_and_schemas/execution_critical_path_and_decision_gates.v1.0.yaml hard_gates
  input_object_refs: 01_contracts_and_schemas/m1_interface_handoff.v0.1.yaml stable_object_surface
  restated_here: false
case_content_rules:
- id: CC-1
  statement: 只出题干不合格：每一例必须带该类要求的判定形态。
  failure_state: CASE_WITHOUT_EVALUATION_FORM
- id: CC-2
  statement: 硬约束题必须有 0/1 事实判定，含 verdict_1 与 verdict_0 两侧条件。
  failure_state: BINARY_DETERMINATION_INCOMPLETE
- id: CC-3
  statement: 机制题必须有可接受推理区间，并引用一个 ADB-M-* 边界族。
  failure_state: REASONING_INTERVAL_MISSING
- id: CC-4
  statement: 开放题必须有至少两个合法解族与可接受边界，并引用一个 ADB-O-* 边界族。
  failure_state: SOLUTION_FAMILY_INSUFFICIENT
- id: CC-5
  statement: ②③ 类一律不得携带唯一 Gold Answer。
  failure_state: SINGLE_GOLD_ANSWER_ON_OPEN_TASK
- id: CC-6
  statement: 高风险例 Founder 覆盖率 100%，不可抽样。
  failure_state: HIGH_RISK_SAMPLED
- id: CC-7
  statement: capability_dimensions 中的每个能力，必须在能力矩阵中声明适用该任务类型。
  failure_state: CAPABILITY_NOT_APPLICABLE_TO_TASK_CLASS
high_risk_open_decision_rule:
  statement: 高风险格子里的开放题不是「安全问题可以开放讨论」。开放的只是硬约束之上的取舍层——每个合法解族都必须先整体通过该场景的硬约束，任一族越界则整题不成立，而不是给它低分。
  failure_state: SAFETY_TASK_SCORED_AS_OPEN_DECISION
  relation: 与 unseen_category_edge_cases.v0.1 的 SR-UC-4 同源；本集合按该规则构造。
usage_scope:
  allowed:
  - 评审员校准（reviewer_calibration_contract RC-01 标定锚点题）
  - 评审分歧率与 Founder 推翻率的测量样本
  - 阈值建议的证据来源
  forbidden:
  - 作为隐藏评测集使用
  - 用隐藏集替换本集合参与阈值调参
  - 把本集合的通过率表述为外部专家通过率
  hidden_set_must_not_be_used_for_tuning: true
  source: DIYU-CBFSK-M2-CLOSEOUT-REPAIR-001 v1.1 第三节 A-3c「严禁使用隐藏集参与任何阈值调参」
anchor_item_binding:
  consumer: 03_m2_evaluation_foundation/evaluation_governance/reviewer_calibration_contract.v0.1.yaml
  consumer_field: machine_checkable_fields.anchor_item_count
  anchor_item_count: 90
machine_checkable_fields:
  total_cases:
    type: integer
    required_value: 90
  grid_cells:
    type: integer
    required_value: 45
  empty_cells:
    type: integer
    required_value: 0
  cases_per_cell:
    type: integer
    required_value: 2
  single_gold_answer_on_open_task_count:
    type: integer
    required_value: 0
failure_states:
- STRATUM_EMPTY
- CASE_WITHOUT_EVALUATION_FORM
- BINARY_DETERMINATION_INCOMPLETE
- REASONING_INTERVAL_MISSING
- SOLUTION_FAMILY_INSUFFICIENT
- SINGLE_GOLD_ANSWER_ON_OPEN_TASK
- HIGH_RISK_SAMPLED
- CAPABILITY_NOT_APPLICABLE_TO_TASK_CLASS
- CASE_ID_COLLISION
