upstream_source:
  file: 01_contracts_and_schemas/m2_evaluation_freeze_brief.md
  section: 第 2 节「M2 必须交付（PRD 13 节 M2 原清单，18 项）」
  rule: 清单读自 Brief，禁止由候选自行声明应交什么。
  checker_reads_brief_directly: true
  checker_reads_brief_directly_note: ci/checkers/check_m2_deliverable_closure.py 直接解析 Brief 的 18 行表格取得序号与
    canonical_name，不读本文件的自述清单——否则就是候选自己给自己出考纲。
four_state_contract:
  frozen_as_contract: true
  ready_is_not_file_exists: true
  states:
  - state: ABSENT
    definition: 文件不存在。
  - state: PARTIAL
    definition: 文件存在但缺内容、实例、证据或测试。
  - state: READY
    definition: 文件与实际内容均存在 ＋ 满足最低数量 ＋ Schema 校验通过 ＋ 正负例通过 ＋ 引用可解析 ＋ 证据哈希完整，但尚未 Founder 冻结。
  - state: FROZEN
    definition: READY 全部满足 ＋ Founder 签署具体 Commit 与资产版本。
  ready_requirements:
  - artifacts_exist
  - minimum_count_met
  - schema_valid
  - positive_and_negative_fixtures_pass
  - references_resolvable
  - evidence_hashes_complete
  frozen_requirements:
  - ready_satisfied
  - founder_freeze_commit_full_hash
  - asset_version_recorded
closure_rules:
- id: CL-1
  statement: 形成 M2 候选须 18 项全 READY（或 FROZEN）。
  failure_state: M2_CANDIDATE_CLAIMED_WITH_INCOMPLETE_DELIVERY
- id: CL-2
  statement: m2_frozen=true 须 18 项全 FROZEN。
  failure_state: M2_FROZEN_WITH_UNFROZEN_DELIVERABLE
- id: CL-3
  statement: 任何以等价物顶替原清单项或降级处理，必须填 founder_supersession_ruling，禁止静默缩减。
  failure_state: SILENT_DELIVERABLE_SUBSTITUTION
- id: CL-4
  statement: 非 READY/FROZEN 的项必须至少记一个 blocker；READY/FROZEN 的项不得带 blocker。
  failure_state: STATUS_CONTRADICTS_BLOCKERS
- id: CL-5
  statement: evidence_hashes 必须与磁盘现算哈希一致。
  failure_state: EVIDENCE_HASH_STALE
current_closure_state:
  deliverable_count: 18
  ready_count: 14
  partial_count: 4
  absent_count: 0
  frozen_count: 0
  all_ready: false
  all_frozen: false
  m2_candidate_formed: false
  m2_frozen: false
  founder_signature_eligible: false
  candidate_status: M2_PARTIAL_DELIVERY_BLOCKED
  single_blocker: HIDDEN_STORAGE_NOT_PROVISIONED
  single_blocker_note: 四个未 READY 项（第 2、3、7、11 项）全部卡在同一个条件上——隐藏侧存储未 provision。不是四个独立缺口，是一个缺口的四处露头。
universal_rule:
  id: GR-CLOSURE-01
  scope: 今后每个里程碑收口
  statement: 每个里程碑收口都必须有一张由上位真源生成的交付覆盖矩阵与对应 closure checker；执行包不得以自身交付清单证明自身完整。
  authority: DIYU-CBFSK-M2-CLOSEOUT-REPAIR-001 v1.1 第一节通则（永久）
  registry: governance/gates/milestone_closure_coverage_rule.v0.1.yaml
  enforced_by: ci/checkers/check_milestone_closure_coverage.py
machine_checkable_fields:
  deliverable_count:
    type: integer
    required_value: 18
  ready_count:
    type: integer
    current_value: 14
  all_ready:
    type: boolean
    current_value: false
  m2_candidate_formed:
    type: boolean
    current_value: false
  silent_substitution_count:
    type: integer
    required_value: 0
failure_states:
- M2_DELIVERABLE_COUNT_DRIFT
- M2_DELIVERABLE_NAME_DRIFT
- M2_DELIVERABLE_INDEX_COLLISION
- M2_CANDIDATE_CLAIMED_WITH_INCOMPLETE_DELIVERY
- M2_FROZEN_WITH_UNFROZEN_DELIVERABLE
- SILENT_DELIVERABLE_SUBSTITUTION
- STATUS_CONTRADICTS_BLOCKERS
- EVIDENCE_HASH_STALE
