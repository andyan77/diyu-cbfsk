why_not_an_adr:
  statement: >-
    商业交付形态是**可撤销的业务假设**，不是不可逆技术决策。写成 ADR 会让一条尚未裁决的业务猜想
    获得架构约束的地位，后续工程会照着它建东西。本记录因此定位为「假设登记」，
    对工程侧只产生一条硬约束：在 Founder 裁决之前不得建设商业化设施。
  basis: MILESTONE_PLAN_M2 v1.1 non_adr_records
  charter_sentence: 商业楔子默认内容先行、API第二步，商业交付形态在M10通过后、M11设计冻结前由Founder裁决。

current_default:
  hypothesis: 内容与账号服务为主、嵌入式造型 API 为辅
  sequence:
    - {order: 1, form: 内容先行}
    - {order: 2, form: API 第二步}
  binding_on_engineering: false
  binding_note: >-
    「默认」只描述当前倾向，不构成对任何里程碑交付物的约束。工程侧不得以本假设为由
    提前建设任何商业化能力。

revisit:
  decision_node: M10 通过后、M11 基线冻结前
  decision_authority: FOUNDER_PRODUCT_AUTHORITY
  decision_id_when_made: PENDING_FOUNDER_COMMERCIAL_FORM_RULING
  before_ruling_state: 假设，未裁决

