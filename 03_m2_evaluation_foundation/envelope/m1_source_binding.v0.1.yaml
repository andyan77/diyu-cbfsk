milestone: M2
execution_package: M2-EP01
status: M2_EP01_DELIVERED
artifact_lifecycle_state: draft
binding_status: PROVISIONAL

contract:
  purpose: >-
    本表是 M1 产物 SHA256 的**唯一**记录处。Envelope 实例与 Profile 成员的 source_artifact_sha256
    必须取自本表；任何文件、报告或 checker 都不得再自行抄一份哈希值（EQ-1）。
  drift_rule: >-
    ci/checkers/check_m2_envelope_contract.py 重算每份 artifact_path 的字节 SHA256 并与本表比对。
    对不上即判 M1_FROZEN_ARTIFACT_DRIFT——M1 冻结物被原位改动，属 Charter 熔断条款，停止并提交 Founder 裁决。
  digest_recipe: sha256(file_bytes)

source_commit: 6499431c66f7bf4a234bd830ee4c810e1ac78694
source_commit_role: M2 启动包 v1.1 signed_baseline_commit / M1-EP01 收口 Commit
source_execution_package: M1-EP01
source_registry: 01_contracts_and_schemas/m1_object_model/schema_registry.v0.1.yaml
source_registry_execution_package_must_be: M1-EP01

binding_scope:
  only_m1_ep01_artifacts: true
  m1_ep02_artifacts_bound: false
  m1_ep03_artifacts_bound: false
  rationale: >-
    签署只授权 signed_baseline_commit 这一个 Commit，其上不存在 M1-EP02 / M1-EP03 产物。
    绑定尚不存在的产物等于凭空造引用，因此本表只收 M1-EP01 已交付且在注册表内登记的 Schema。
  enforcement: >-
    每条 artifact_path 必须出现在 source_registry 的 entries[].file 中，
    且注册表自身的 execution_package 必须为 M1-EP01；两项任一不成立即 BINDING_OUTSIDE_M1_EP01。

rebind_rule:
  trigger: M1 收口合入 main
  action: REBIND_AND_RETEST
  owner_package: M2-EP02
  meaning: >-
    仅新增 M1-EP02 / M1-EP03 产物（既有产物字节未变）不是漂移，属正常前进；
    此时由 M2-EP02 重算全部绑定、把 binding_status 由 PROVISIONAL 改 FINAL 并重跑评测组合。
  distinction: >-
    「既有 M1 冻结物内容变了」= M1_FROZEN_ARTIFACT_DRIFT（熔断，停）；
    「只是多了新产物」= REBIND_AND_RETEST（EP02 正常动作）。两者不可混为一谈。

