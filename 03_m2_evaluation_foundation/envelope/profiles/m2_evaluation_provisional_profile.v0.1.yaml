profile_id: m2_evaluation_provisional_profile
profile_version: "0.1"
purpose: >-
  M2 评测所需的最小 M1 组合：三份运行时产物（整包 / 决策追溯 / 视觉属性）承接评分对象，
  两份长期真源（品牌事实 / 搭配师人设）承接未见品牌切分与人设连续性评分，
  一份公共定义提供七级事实优先级与品类枚举。不建通用组合框架——只建这一份，够用为止。
