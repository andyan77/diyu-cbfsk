schema_version: "0.1"
contract_id: DIYU-CBFSK-M2-EVALUATION-SAMPLING-DESIGN
artifact_id: evaluation_sampling_design.v0.1
project_id: DIYU-CBFSK-001
milestone: M2
execution_package: M2-EP01
status: M2_EP01_CONTRACT_LANDED
artifact_lifecycle_state: draft
prd_anchors: [PRD-10.2, PRD-15.4, PRD-16.4]
brief_anchor: 01_contracts_and_schemas/m2_evaluation_freeze_brief.md 第 2 节第 9 项

scope_note:
  this_package_delivers: 分层维度与抽样规则合同 + 最小机器可检字段
  this_package_does_not_deliver: [抽样执行器, 任何抽样结果, 任何评测题]
  freeze_status: NOT_FROZEN
  freeze_at: M2 冻结

stratification_dimensions:
  count: 3
  source: 01_contracts_and_schemas/m2_evaluation_freeze_brief.md 第 2 节第 9 项「品类 × 任务类型 × 风险等级」
  items:
    - id: SD-1
      dimension: category
      values_source: 01_contracts_and_schemas/m1_object_model/common_defs.schema.v0.1.json#/definitions/categoryId
      values_restated_here: false
      note: 五类品类枚举只有一个定义处，本文件引用不复述（EQ-1）。
    - id: SD-2
      dimension: evaluation_task_class
      values: [constraint_correctness, mechanism_correctness, open_decision]
      ruling: D-28
      note: 每一道题必须归入且只归入一类。
    - id: SD-3
      dimension: risk_tier
      values: [high, medium, low]
      values_source: governance/bootstrap/role_operating_model.v0.2.yaml review_mode.risk_tiered_review

sampling_rules:
  - id: SR-1
    applies_to_risk_tier: high
    founder_review_coverage: 1.0
    sampling_allowed: false
    statement: 高风险 100% Founder 全审，不可抽样。
    high_risk_topics_source: governance/bootstrap/role_operating_model.v0.2.yaml review_mode.risk_tiered_review.high_risk_topics
    failure_state: HIGH_RISK_SAMPLED
  - id: SR-2
    applies_to_risk_tier: [medium, low]
    founder_review: stratified_sampling
    ai_review: multi_reviewer
    checker_review: deterministic
    sampling_ratio: null
    sampling_ratio_status: M2_FREEZE_REQUIRED
    failure_state: SAMPLING_RATIO_NOT_FROZEN_AT_M2
  - id: SR-3
    statement: 每个分层格子（品类 × 任务类型 × 风险等级）必须有非零样本，不得整格缺席。
    failure_state: STRATUM_EMPTY
  - id: SR-4
    statement: 抽样不得在失败后重抽以取得更好结果。
    failure_state: RESAMPLED_AFTER_FAILURE
    relation: 与 benchmark_revision_protocol 的「因失败而降标永久禁止」同源。

machine_checkable_fields:
  stratification_dimension_count: {type: integer, required_value: 3}
  high_risk_founder_full_review_rate: {type: number, required_value: 1.0, adjustable: false}
  high_risk_sampling_allowed: {type: boolean, required_value: false}
  medium_low_sampling_ratio: {type: number, current_value: null, threshold_status: M2_FREEZE_REQUIRED}
  empty_stratum_count: {type: integer, required_value: 0}

current_state:
  strata_defined: false
  samples_drawn: 0
  note: 本包只定义分层维度与规则；没有评测题就没有可抽的样本，先建抽样器属先建框架。
