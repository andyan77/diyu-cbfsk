schema_version: "0.1"
contract_id: DIYU-CBFSK-M2-HIDDEN-ASSET-GENERATION-CONTRACT
artifact_id: hidden_asset_generation_contract.v0.1
project_id: DIYU-CBFSK-001
milestone: M2
execution_package: M2-EP02
status: M2_EP02_DELIVERED_BUT_UNEXECUTED
artifact_lifecycle_state: draft
blocked_by: HIDDEN_STORAGE_NOT_PROVISIONED
blocked_record: 03_m2_evaluation_foundation/hidden_assets/hidden_asset_stop_record.v0.1.yaml

single_implementation:
  boundary_enforcement_delegated_to: ci/checkers/check_hidden_benchmark_boundary.py
  second_implementation_created: false
  stop_condition_if_violated: DUPLICATE_HIDDEN_BOUNDARY_IMPLEMENTATION
  storage_contract: governance/storage/hidden_benchmark_storage_contract.yaml
  note: >-
    本合同只规定「生成时按什么规则」，边界执行一概复用既有实现。
    再写一套隐藏边界扫描，两套判据迟早分叉——一套拦得住、另一套拦不住，而报告只会引用其中一套。

execution_precondition:
  all_required: true
  items:
    - id: PRE-HID-01
      requirement: STORE-A（或 Founder 改选的存储）实际 provision 且访问控制生效
      current: false
      verification: hidden_benchmark_storage_contract.allowed_storage[*].provisioned
    - id: PRE-HID-02
      requirement: COND-011 关闭并绑定裁决 Commit
      current: OPEN
    - id: PRE-HID-03
      requirement: Founder 明示授权开始生成
      current: false
  consequence_if_unmet: 不生成任何隐藏题、隐藏品牌、夹具品牌或答案资产；不得就近落在主仓。

main_repository_allowed_artifacts:
  source: governance/storage/hidden_benchmark_storage_contract.yaml main_repository.allowed_artifacts
  restated_here: false
  restated_here_note: 清单只有一个定义处，本合同引用不复制（EQ-1）。
  in_scope_for_this_contract: [manifest, 计数, 哈希, 隔离断言]
  never_in_main_repository:
    - 隐藏题正文
    - 参考答案
    - 评分细则的保密部分
    - 隐藏品牌完整事实包
    - 生成参数
    - 隐藏运行原始输出

sampling_design_binding:
  source: 03_m2_evaluation_foundation/evaluation_governance/evaluation_sampling_design.v0.1.yaml
  restated_here: false
  required_strata: [category, evaluation_task_class, risk_tier]
  rule_refs: [SD-1, SD-2, SD-3, SR-1, SR-3]
  empty_stratum_forbidden: true
  empty_stratum_failure_state: STRATUM_EMPTY

homogeneity_control:
  ruling_anchors: [D-18, PRD-8.7]
  separation_required_between: [夹具池, 隐藏池]
  separated_on:
    - 生成配方
    - 参数空间
    - 随机种子
    - 工作区
    - 上下文
  hidden_pool_extra: 隐藏池另有专属风格坐标覆盖
  founder_package_must_not_enter_hidden_pool: true
  founder_package_rule_source: D-18
  failure_states: [HIDDEN_POOL_HOMOGENEOUS_WITH_FIXTURE_POOL, FOUNDER_PACKAGE_IN_HIDDEN_SET]
  double_check_required: 泄漏 ＋ 同质性双检查报告

synthetic_marking:
  required: true
  rule: 所有合成资产必须显式标记 synthetic=true 与生成来源
  why: >-
    不标记的合成品牌一旦流出，读者无从判断它是不是真实品牌事实。
    「看起来像真的」正是合成资产的设计目标，因此标记不能靠人记得。
  failure_state: SYNTHETIC_ASSET_UNMARKED
  real_brand_data_forbidden: true

verifiability_principle:
  id: HID-VERIFY-01
  statement: >-
    收口时 Guardian 与总顾问只凭 manifest、计数、哈希与边界判据核验隔离，
    不得要求读取隐藏内容。
  rationale: >-
    要求读取隐藏内容才能核验，等于为了证明隔离而破坏隔离。审查者一旦读过隐藏题，
    该隐藏集对这位审查者就永久失效——而审查者恰恰参与后续所有轮次。
  reviewer_may_verify_with: [frozen manifest, item counts, content hashes, 边界判据结果, runner 接口定义, 结果摘要]
  reviewer_may_not_request: [隐藏题正文, 参考答案, 隐藏品牌完整事实包, 逐题原始输出, 生成参数]
  on_such_request: 一律拒绝并报告
  failure_state: HIDDEN_CONTENT_DISCLOSURE_REQUESTED
  applies_to: [CLAUDE_INDEPENDENT_GUARDIAN, GPT_CHIEF_ADVISOR, CODEX_EXECUTION_ENGINEER, CLAUDE_EXECUTION_PLANNER]
  founder_exempt: true
  founder_exempt_note: Founder 是隐藏集的所有者，不受本条限制。

freeze_timing:
  hidden_assets_freeze_effective_from: Founder 收口签署
  before_signature: 可修订
  after_signature: 按 benchmark_revision_protocol 的唯一合法通道修订
  source: DIYU-CBFSK-FOUNDER-M2-CHARTER-001 审查安排
