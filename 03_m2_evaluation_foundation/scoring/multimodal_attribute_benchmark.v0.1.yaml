scope_boundary:
  anchored_by: DIYU-CBFSK-FOUNDER-M2-EP05-001 article_0_anchors.anchor_1_multimodal_boundary
  anchor_statement_verbatim: >-
    品牌专属数据库/PIM/ERP 结构化事实为权威，人工确认视觉属性次之，
    多模态视觉推断可作为有来源、有置信度的补充证据；推断不得覆盖权威事实，
    不得仅凭图片断言成分、性能、库存、价格与安全认证。
  evidence_order: [authoritative, human_confirmed, model_inferred]
  inference_may_override_authoritative: false
  forbidden_image_only_assertions: [成分, 性能, 库存, 价格, 安全认证]
  prd_anchor:
    document: 笛语跨品牌服装搭配专家内核_PRD与执行里程碑_v1.2.docx
    section: 3.2 非目标
    verbatim: 品牌专属数据库仍为权威事实来源；多模态视觉推断按 D-23 分层引入（authoritative > human_confirmed > model_inferred），推断不得覆盖权威事实，不得推断成分、性能、库存与安全认证。
    parsed_at_check_time: true
    parsed_by: ci/checkers/check_m2_capability_matrix.py
  number_correction:
    erroneous_number: D-10
    erroneous_number_source: Founder 侧派发件编号笔误（EP05 裁决第零节自认）
    historical_clause_true_number: D-12
    historical_clause_title: 商品属性来源
    current_controlling_clause_true_number: D-23
    current_controlling_clause_effect: 在 D-12 基础上分层引入视觉推断，权威事实仍不可被推断覆盖
    erroneous_number_must_not_be_reused: true
  retired_stop_code:
    code: MULTIMODAL_SCOPE_CONFLICT_WITH_D10
    status: RETIRED
    reason: 无实现、无夹具，且码名内嵌错误编号；按 EP05 裁决第二节作废删除。
    replaced_by_machine_predicates:
      - MULTIMODAL_SCOPE_EXCEEDS_AUTHORITATIVE_FACT_BOUNDARY
      - MULTIMODAL_EVIDENCE_ORDER_DRIFT
      - MULTIMODAL_FORBIDDEN_ATTRIBUTE_IN_SCOPE
    replacement_is_machine_checked: true
    why_not_just_delete_the_claim: >-
      作废一条杜撰的停止码不等于放弃那份保护。原本想守的事是「多模态评测别越界去当属性来源」——
      这件事现在由三条现场解析 PRD 正文的判据守，边界从裁决正文来，不从码名来。
  what_this_benchmark_does_not_test:
    - 把图像识别当作商品属性来源的准确率（D-12：V1.0 不立项该工程线）
    - 成分、性能、库存与安全认证的视觉推断（D-23 明文禁止推断）
    - 任何用视觉推断覆盖权威结构化事实的场景被判为「可接受」
  what_this_benchmark_tests:
    - 证据等级标记是否正确（model_inferred 不得伪装成 authoritative 或 human_confirmed）
    - 视觉推断与权威事实冲突时是否以权威事实为准
    - 对禁止推断的属性类目是否弃权而不是硬猜
    - 同一商品多张图之间的推断是否自洽
    - 低质量图像是否走 fail-closed 而不是低置信度硬答
    - 在允许范围内（廓形、颜色、结构、材质观感等搭配决策所需视觉属性）的推断准确率——
      作为能力指标，不作为属性来源

