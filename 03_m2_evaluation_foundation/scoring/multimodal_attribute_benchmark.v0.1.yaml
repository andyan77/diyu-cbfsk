scope_boundary_check:
  stop_condition_evaluated: MULTIMODAL_SCOPE_CONFLICT_WITH_D10
  triggered: false
  evidence_level: runtime_verified
  anchor_discrepancy:
    task_prompt_cites: D-10「V1.0 商品属性来源于品牌专属数据库、不做图像识别提取」
    repository_truth:
      - fact: PRD v1.2 正文与 v1.1 Delta 中，D-10 的标题是「运行时模型合同」（模型无关、Founder 供 API），不是商品属性来源。
        source: 归档_v1.0/笛语跨品牌服装搭配专家内核_PRD_v1.1_Delta.docx 第三部分 D-10
      - fact: 任务 Prompt 所引的那段实质内容，逐字对应的是 D-12「商品属性来源」。
        source: 归档_v1.0/笛语跨品牌服装搭配专家内核_PRD_v1.1_Delta.docx 第三部分 D-12
        verbatim: 商品与货盘属性以品牌专属数据库（品牌真源 / PIM / ERP 等）为唯一来源；V1.0 不立项图像识别属性提取工程线。
      - fact: D-12 在 PRD v1.2 中被 D-23 部分改判，现行非目标条文为分层引入视觉推断。
        source: 笛语跨品牌服装搭配专家内核_PRD与执行里程碑_v1.2.docx 3.2 非目标
        verbatim: 品牌专属数据库仍为权威事实来源；多模态视觉推断按 D-23 分层引入（authoritative > human_confirmed > model_inferred），推断不得覆盖权威事实，不得推断成分、性能、库存与安全认证。
    handling: >-
      执行侧既未放宽也未改写任何裁决，只是按编号核对了真源。本卡的边界取 D-12 与 D-23 的**交集**：
      属性来源仍唯一是品牌专属数据库（D-12 未被推翻的部分），视觉推断只能作为带证据等级的下层信息存在
      （D-23 改判后的部分）。两条同时成立时可评的东西是清楚的，因此不触发 STOP。
    founder_action_requested: 确认编号更正（D-10 → D-12）并批准本卡边界；如 Founder 另有口径，以 Founder 为准。
  what_this_benchmark_does_not_test:
    - 把图像识别当作商品属性来源的准确率（D-12：V1.0 不立项该工程线）
    - 成分、性能、库存与安全认证的视觉推断（D-23 明文禁止推断）
    - 任何用视觉推断覆盖权威结构化事实的场景被判为「可接受」
  what_this_benchmark_tests:
    - 证据等级标记是否正确（model_inferred 不得伪装成 authoritative 或 human_confirmed）
    - 视觉推断与权威事实冲突时是否以权威事实为准
    - 对禁止推断的属性类目是否弃权而不是硬猜
    - 同一商品多张图之间的推断是否自洽
    - 低质量图像是否走 fail-closed 而不是低置信度硬答
    - 在允许范围内（廓形、颜色、结构、材质观感等搭配决策所需视觉属性）的推断准确率——
      作为能力指标，不作为属性来源

