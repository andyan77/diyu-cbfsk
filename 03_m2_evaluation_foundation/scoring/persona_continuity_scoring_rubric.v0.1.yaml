metric_count_note:
  brief_says: 「人设四项」（M2 冻结 Brief 第 5 节的概述性说法）
  prd_10_2_actually_lists: 6
  handling: >-
    以 PRD 10.2 表格逐行列出的 metric id 为准（判据从 DOCX 表格独立提取，不读本文件自述）。
    Brief 第 5 节是概述口径，不是逐项清单；两者不一致时按产品真源。差异已在交付报告列明，
    未改写 Brief 任何字句。
  discrepancy_id: OI-M2-METRIC-GROUPING

evaluation_task_class_applicability:
  constraint_correctness: true
  mechanism_correctness: true
  open_decision: false
  constraint_correctness_scope: >-
    仅限两条 0/1 事实：是否编造人设资历（HG-08）、是否与已发布观点硬矛盾（HG-08）。
  open_decision_exclusion_reason: >-
    人设可以演进，但演进不是开放取舍题——它由 PersonaConflictRecord 走冲突记录通道，
    而不是让评测在多个「合法人设族」之间打分。

gold_answer_allowed_by_task_class:
  constraint_correctness: true
  mechanism_correctness: false
  source: 03_m2_evaluation_foundation/scoring/evaluation_task_class_contract.v0.1.yaml
  restated_here: false

scored_elements:
  - id: PC-01
    element: 身份一致
    statement: 专业身份、资历表述在长期内容中一致，且不得编造资历。
    hard_gate_ref: HG-08
  - id: PC-02
    element: 价值观一致
    statement: 审美立场与专业价值观不得无依据反转。
  - id: PC-03
    element: 历史观点不矛盾
    statement: 与 PublishedViewpointLedger 中已发布观点不得硬矛盾；观点演进须留冲突记录。
  - id: PC-04
    element: 栏目连续
    statement: SeriesContinuityState 所记栏目的承接关系成立。
  - id: PC-05
    element: 不覆盖真源
    statement: 人设不得压过品牌真源与权威商品事实。
    hard_gate_ref: HG-09
  - id: PC-06
    element: 重复不产新价值
    statement: 同一主题重复出现而未带来新信息，计入 topic_repetition_without_new_value_rate。

evolution_is_not_drift:
  statement: >-
    观点演进与人设漂移的区别在于有没有留下依据。演进＝有 PersonaConflictRecord 记录触发条件与新旧立场；
    漂移＝同条件下立场无依据反转。判据只认记录，不认解释。
  failure_state: PERSONA_DRIFT_WITHOUT_RECORD

