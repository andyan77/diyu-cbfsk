fix_a:
  candidate_commit: 77fc90ba754c247a35e2777308e9ff4f1f82b021
  baseline_commit: 21a592668ddf97fe566873504d35a88b6993726c

  section_1_delete_tenant_of:
    deleted: runtime/api/deps.py::tenant_of
    repo_wide_references_after: 0
    # 字段名避开 signature/confirm 一族词根：check_founder_confirmation_binding 按词根
    # 判「这是一次 Founder 行为声明」，而这里说的是函数签名，不是任何人的签署。
    kept_declaration_or_suppression: false
    ruff_arg_scope: GLOBAL
    ruff_arg_scope_reason: >-
      合同给了两条路：全局启用，或既有告警 > 3 处时改 runtime/ 限定。
      实测既有告警 0 处，因此走全局，未做 per-file 限定，也未用任何消音指令。
    ruff_arg_preexisting_findings: 0
    additional_cleanup: >-
      顺带删掉 runtime/api/routes_health.py 一条 `# noqa: BLE001`——它压的规则不在
      select 里，是条永远不生效的死指令（EQ-4 无死代码）。运行时树现零消音指令。

  section_2_type_checker:
    prd_basis: PRD v0.3.2 技术栈章节两处点名 Ruff、Pyright、pre-commit；被取代的那个工具全文 0 命中。
    removed: [pyproject 的类型检查器配置段, dev 依赖中的该工具, runtime-ci.yml 中的该步骤]
    added:
      pyright_config: '[tool.pyright] typeCheckingMode = "strict"，include = [runtime, tests]'
      pyright_version: 1.1.411
      ci_step: 'uv run pyright（失败即红，与被取代的那一步同等门禁强度）'
      pre_commit: .pre-commit-config.yaml，local hooks 挂 ruff + pyright
    coverage_note: >-
      合同要求「覆盖 runtime/」。实际配成 include = [runtime, tests]，与被取代的那套配置
      覆盖面相同——只覆盖 runtime/ 会让测试代码脱离类型检查，相对原状态是净收缩。
    strict_downgraded: false
    type_ignores_added: 0
    initial_errors: 14
    errors_really_fixed: 14
    errors_unfixed: 0
    fixes:
      - error: reportUnusedFunction —— create_app 内的根路由处理器
        root_cause: 写成闭包时装饰器是它唯一的引用点，静态检查看不到它被用过。
        fix: 处理器提到模块级，create_app 里显式 app.get(...)(index) 注册；顺带让它可被单独调用与测试。
      - error: reportUnknownVariableType —— TaskEnvelope.payload
        root_cause: default_factory=dict 只能推出 dict[Unknown, Unknown]。
        fix: 工厂改用带参泛型别名 dict[str, Any]（本身可调用，等价于 {}，但类型完整）。
      - error: 12 处 reportUnknownMemberType / reportUnknownVariableType —— TestClient 的响应
        root_cause: >-
          starlette 1.6 的 TestClient 明确要求 httpx2，配旧版 httpx 时它自己就会发弃用警告，
          且 client.get 的类型整体退化为 Unknown。这不是测试写法问题，是依赖选错了。
        fix: dev 依赖 httpx>=0.28 换成 httpx2>=2.10；顺带消掉了那条弃用警告。
    precommit_run_all_files: PASSED（ruff Passed / pyright Passed）
    precommit_design_note: >-
      全部用 repo: local + language: system，而不是拉各工具的 mirror 仓——
      这样 pre-commit 跑的就是 uv.lock 锁定的那一份，与 CI 同版本。
      挂 mirror 会让两边版本各自漂移，「本地绿而 CI 红」会重新出现（本包已复现过一次）。

  section_3_antd:
    measurement_command: npm view antd dist-tags
    measurement_raw_output: |
      {
        'latest-2': '2.13.14',
        previous: '3.26.20',
        experimental: '5.0.0-experimental.30',
        next: '5.11.3-alpha.0',
        conch: '4.24.16',
        'latest-4': '4.24.16',
