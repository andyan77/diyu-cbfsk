# ---------------------------------------------------------------------------
# 已知问题
# ---------------------------------------------------------------------------
known_issues:
  - id: KI-EP01-01
    statement: >-
      app 角色是 NOBYPASSRLS，但库里尚无任何 RLS 策略——在没有策略的前提下，
      NOBYPASSRLS 是一道空守卫。目前跨租户隔离靠的是复合外键（结构层）与
      服务端会话固化的租户上下文（应用层），不靠行级安全。
      咬人的条件：出现第二条数据访问路径（直连 SQL、报表工具、运维脚本）时，
      它们不经过应用层，就只剩复合外键这一道。
    disposition: DEFERRED_TO_BR1
  - id: KI-EP01-02
    statement: >-
      web/package-lock.json 与 e2e/package-lock.json 落在各自 package.json 旁边，
      而不是执行合同 §四 目录树字面所示的仓根。npm 要求 lockfile 与 package.json 同级，
      放仓根 `npm ci` 不认。属结构性偏离字面目录树，不是漏交付。
    disposition: ACCEPTED_RISK
  - id: KI-EP01-03
    statement: >-
      为让边界扫描保持字面严格（不加排除面），三处说明性注释里的
      「计费 / Billing / Celery 等框架名」改用同义中文表述。
      咬人的条件：后续有人想在注释里写出这些字面词做说明时会被扫描判红，
      需要按同样方式改措辞，而不是给扫描加白名单。
    disposition: ACCEPTED_RISK
  - id: KI-EP01-04
    statement: >-
      类型检查器配置固定 pythonVersion = "3.13"，因此 3.14 那条 CI 腿做的是
      「用 3.14 解释器跑 3.13 语义的类型检查」，不是 3.14 语义的类型检查。
      运行时与测试在 3.14 上是真跑的；只有类型语义这一层没有独立的 3.14 口径。
      FIX-A 更换了类型检查器（回归 PRD 指定的 Pyright），本条事实不因换工具而改变。
    disposition: DEFERRED_TO_BR1
  - id: KI-EP01-05
    statement: >-
      Staging 未安装定时备份 timer。本包库内尚无任何客户数据，因此不构成当下风险；
      但第一条真实客户数据进库之前备份必须先就位，这条属 BR1 退出门。
    disposition: DEFERRED_TO_BR1
  - id: KI-FIXA-01
    statement: >-
      ECS Staging 上跑的镜像标签是 ad375df，仓库 HEAD 已推进到 FIX-A（77fc90b）。
      FIX-A 执行合同明令「不连 ECS」，因此未重新部署——Staging 落后仓库四个提交。
      落后的内容是：tenant_of 删除、类型检查器更换、antd v6、pre-commit 配置。
      前两项不影响运行时行为（tenant_of 本就 0 调用点，类型检查不进运行时），
      antd v6 影响的是前端构建产物，因此 Staging 上的工作台仍是 antd v5 构建。
      咬人的条件：任何人拿 Staging 当「HEAD 的样子」验收前端，看到的会是旧版 UI。
    disposition: DEFERRED_REQUIRES_FOUNDER_DECISION
  - id: KI-FIXA-02
    statement: >-
      ruff ARG 对本仓现有代码零命中，原因之一是四处「接口要求存在、函数体不用」的参数
      用了 `del x` 惯用法显式引用（Protocol 实现、信号处理器、pytest 夹具各一到两处），
      而 ARG 不会对被引用过的参数报警。也就是说 ARG 挡得住「新写的函数忘了用参数」，
      挡不住「用 del 抹掉后再什么都不做」——被删掉的 tenant_of 恰是后一种。
      咬人的条件：有人照 tenant_of 的写法再造一个「看起来在校验、实际 del 掉」的函数，
      ARG 不会响。真正挡住它的是 code review 与「全仓 0 调用点即删除」这条纪律，不是判据。
    disposition: ACCEPTED_RISK
  - id: KI-FIXA-03
    statement: >-
      初始账号口令「现场随机生成并在 bootstrap 后 shred」这一条，
      是本执行窗口的自述，窗口 B 明确未做判定（核验需读取口令材料，超出其只读清单）。
      故标 SELF_ATTESTED_NOT_INDEPENDENTLY_VERIFIED，不得表述为「已核验」。
      咬人的条件：若该自述不实，一个管理员口令会长期留在共享主机文件系统上。
    disposition: REQUIRES_FOUNDER_DECISION
