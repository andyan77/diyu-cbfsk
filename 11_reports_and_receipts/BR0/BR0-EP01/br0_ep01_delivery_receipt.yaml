        guidelines: '5.30.0-guidelines-alpha.1',
        'conch-v6': '6.5.2',
        latest: '6.6.0'
      }
    versions_tail_raw_output: |
      npm view antd versions --json | tail -20
        "6.3.1",
        "6.3.2",
        "6.3.3",
        "6.3.4",
        "6.3.5",
        "6.3.6",
        "6.3.7",
        "6.4.0",
        "6.4.1",
        "6.4.2",
        "6.4.3",
        "6.4.4",
        "6.4.5",
        "6.5.0",
        "6.5.1",
        "6.5.2",
        "6.5.3",
        "6.5.4",
        "6.6.0"
      ]
    branch_taken: BRANCH_1_UPGRADE_TO_V6
    branch_justification: dist-tags.latest = 6.6.0，即 v6 已 GA，与分支①的判据一致。
    from_version: 5.29.3
    to_version: 6.6.0
    pinned_exactly: true
    lockfile_locked_version: 6.6.0
    frontend_source_changes_required: 0
    frontend_source_changes_note: >-
      三个源文件用到的 antd API（ConfigProvider / App / Layout / Card / Form / Input /
      Select / Table / Descriptions / Typography / Alert / Divider / Space / Button）
      在 v6 上全部沿用，tsc --noEmit 与 vite build 一次通过，未改一行源码。
    ci_after_upgrade: frontend 作业绿、e2e 作业绿（本地 Playwright 2 用例亦全绿）
    cost_note: >-
      前端此刻只有 3 个源文件，是升级成本的最低点。等到内容工作台建完再升，成本量级完全不同。

  section_4_deviation_rule:
