# ---------------------------------------------------------------------------
# 租户安全根
# ---------------------------------------------------------------------------
tenant_root:
  tenant_id_not_null_tables: [brands, draft_tasks, tenant_memberships, tenant_settings]
  tenant_root_whitelist:
    tenants: 本表是租户根自身，主键即 tenant_id
    users: 自然人身份跨租户唯一，租户归属由 tenant_memberships 承载
    alembic_version: alembic 自身的版本表，不是客户数据表
  composite_foreign_key: draft_tasks (tenant_id, brand_id) -> brands (tenant_id, id) ON DELETE RESTRICT
  no_brand_id_tables: [tenants, tenant_memberships, tenant_settings]
  tenant_context_source: 服务端会话（runtime/api/deps.py 的 current_tenant_id 为唯一产出处）
  request_surface_tenant_fields: 1
  request_surface_note: >-
    唯一接受租户标识入参的端点是 PUT /api/session/tenant，它做的是「校验成员关系后固化进会话」，
    不是「按参数取数据」。CI boundaries 作业按字段声明数目断言这一点。
  database_roles:
    migrator: cbfsk_migrator（拥有库、可改结构、只在迁移期使用）
    app: cbfsk_app（NOBYPASSRLS、NOSUPERUSER、NOCREATEDB、NOCREATEROLE、仅 DML 权限）
  app_role_ddl_privileges: 0
  rls_policies_enabled: false
  rls_note: >-
    本包按合同只做角色分离与 NOBYPASSRLS，未启用行级安全策略。
    NOBYPASSRLS 在没有 RLS 策略时是空守卫——如实记录，不表述为「已具备 RLS 隔离」。
    见 known_issues KI-EP01-01。

