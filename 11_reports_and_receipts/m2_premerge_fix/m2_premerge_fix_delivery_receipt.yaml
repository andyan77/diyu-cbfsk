self_reference_limitation: >-
  本包自己的候选 Commit 在提交那一刻才产生，写不进被提交的内容。
  本轮**不写占位串**（B-02-1 禁用 RESOLVED_AT_REPORT_TIME 之类）：相关字段一律留 null
  并声明 candidate_commit_binding，由判据现算 `git rev-parse HEAD` 得到。
  留空是「这里没有值，去问 git」；占位是「这里有个值，只是还没算」——后者会骗人。
