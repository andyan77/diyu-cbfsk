concurrent_window_handling:
  what_happened: >-
    本裁决同时被发到两个执行窗口，两者在同一 worktree 上交错写入约十三分钟
    （本窗口 11:48–11:52，另一窗口 11:52–12:01）。发现方式：本窗口一次
    `assert s.count(old) == 1` 当场失败——文件在读取与写入之间被改过。
  evidence:
  - ci/checkers/check_project_state.py（非本窗口所写）import 了本窗口十分钟前才创建的 ci/derived_state.py，函数名一字不差
  - 两窗口独立分配了同一个裁决编号 DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001
  - 发现时仓库为红：30+ 判据失败、2 份夹具失败、2 处 collect() 崩溃
  action_taken: 停手并向 Founder 报告，未继续写入。
  founder_decision: 关闭另一窗口，由本窗口接管收口。
  what_was_kept: >-
    另一窗口已落的产物全部保留并在其上继续——scan_coverage_measurement_ledger、
    artifact_change_since_delivery_freeze、check_project_state 的 README 漂移守卫与派生字段判据、
    known_design_gaps / m2_seal_ledger / m2_package_commit_ledger / m2_premerge_review_request 的数据侧改写。
    复核属实，且与本窗口的设计一致，无需重做。
  what_this_window_completed: 判据侧（check_m2_suspension_seal 全量重写）、B-04-4 横扫机制、夹具、登记册与报告。
  risk_disclosed: >-
    交错写入期间可能发生过未被察觉的丢更新。本包全量自检通过，但「自检通过」不等于
    「没有内容在交错中丢失」——这一点如实记录，供 R2 两侧复审时留意。

