prior_window_handling:
  prior_commit: f71617eee44a6008d8180fe81aeea901efc54816
  decision: BUILT_ON_NOT_REVERTED
  why: >-
    裁决第一节写着「不重写、不回退、不删除」。回退一个已推送的提交要么产生 revert 提交、
    要么强推改写历史，两者都与该条相违；而那一版记录的事实经复核属实，是不完整，不是错。
    因此就地扩写为本裁决要求的挂起记录，并保留它曾是 doc-only 的事实与被取代的理由。
  what_was_corrected:
  - field: review_status_at_seal.why_review_cannot_start_now
    why: 本裁决第三节把审查对象改为「结扎落盘后形成的最终候选」，该对象在本包提交后即存在；旧结论对旧对象成立，对新对象不成立。
  - field: form.kind = DOC_ONLY
    why: 本裁决第二节明文「一律以机器状态封存，不以意图封存」，且 SEAL-1 要求判据；doc-only 形态就此作废。
  founder_offered_rollback: true
  rollback_not_taken_reason: 见 why；如 Founder 仍要回退，须另行具名裁决——回退本身是一次改写历史的动作。

