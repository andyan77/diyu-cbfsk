hash_contract:
  implementation: ci/checkers/_common.py
  implementation_note: >-
    三层哈希只有这一个实现；任何文件、报告或 checker 都不得再自行推导一套（单一实现原则）。
    本合同文字必须与该实现严格一致，实现改动时必须同步改本合同并重算下方所有派生哈希。
  binary_sha256: >-
    SHA-256 over the complete file bytes.
  canonical_docx_xml_sha256: >-
    NOT XML C14N 2.0. SHA-256 over the concatenation, in sorted ZIP member-name order, of every
    part whose name ends in .xml or .rels except docProps/core.xml and docProps/app.xml.
    Each part is serialised recursively as <tag attr=repr(value) ...>stripped-text children</tag>,
    with attributes sorted by name and any attribute whose local name matches
    rsid* / paraId / textId dropped. Namespaces are kept in Clark notation as parsed;
    comments, processing instructions and inter-element whitespace are not preserved.
  semantic_text_sha256: >-
    SHA-256 over newline-joined records: for word/document.xml first, then every
    word/header<N>.xml and word/footer<N>.xml in sorted name order, a <<PART:name>> marker
    followed by one record per w:p element. Because w:p inside w:tbl is included by the
    element walk, table cell text is covered. Each record is the concatenation of its w:t
    texts, NFKC-normalised, whitespace-collapsed; empty records are dropped.
  derived_hash_supersession:
    superseded_at: "2026-08-13"
    reason: >-
      Phase 0 (Codex) 的 canonical/semantic 值由一套已不在本仓的实现产出，在候选内实现下无法复现，
      构成同一功能两套实现并存。按 Founder 修复指令 BLOCK-01 (a)，改由候选内唯一实现重算并写回；
      Phase 0 原值保留在 phase_0_recorded_* 字段供审计比对。
    binary_layer_changed: false
    binary_layer_note: >-
      binary_sha256 未变，且仍与 Founder 本轮提供的参考值逐一相等——文件身份未变，
      本次只更正派生层的记录值。


