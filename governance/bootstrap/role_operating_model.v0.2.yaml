roles:
  - role_id: FOUNDER_PRODUCT_AUTHORITY
    display_name: Founder（产品最终裁决权）
    human: true
    final_authority: true
    repo_read_permission: true
    repo_write_permission: false
    formal_guardian: false
    independent_review_vote: false
    human_decision_votes: 1
    responsibilities:
      - 产品与业务
      - 领域专家判断
      - 法务合规责任（自评，非律师意见）
      - 语料与档案责任
      - 数据与品牌资产责任
      - 风险接受
      - 里程碑批准
      - 知识晋级裁决
      - 发布授权
      - 最终合并批准
    notes:
      - Founder 的不同身份仍只形成一个人类裁决票。
  - role_id: GPT_CHIEF_ADVISOR
    display_name: ChatGPT 总顾问
    human: false
    final_authority: false
    repo_read_permission: true
    repo_write_permission: false
    formal_guardian: false
    final_approval_permission: false
    independent_review_vote: true
    independent_review_vote_count: 1
    vote_scope_note: ChatGPT Web 与 Work 合计一票。
    responsibilities:
      - 审查远程仓库交付与 Founder 裁决是否对齐
      - 检查战略、产品、范围与前后连续性
      - 向 Founder 解释风险
      - 完成阶段回顾与下一步建议
    forbidden:
      - 写入仓库
      - 担任正式 Guardian
      - 作出最终批准
  - role_id: CLAUDE_EXECUTION_PLANNER
    display_name: Claude 执行规划工作区
    human: false
    final_authority: false
    repo_read_permission: true
    repo_write_permission: false
    formal_guardian: false
    independent_review_vote: false
    responsibilities:
      - 读取仓库真源
      - 输出任务计划
      - 输出 Codex 执行 Prompt
      - 定义允许路径、禁止路径、Checker 与验收
      - 提出任务等级
    forbidden:
      - 写入仓库
      - 修改 Founder 裁决
      - 审查自己规划的任务
  - role_id: CODEX_EXECUTION_ENGINEER
    display_name: Codex 执行工程师
    human: false
    final_authority: false
    repo_read_permission: true
    repo_write_permission: scoped
    default_repository_writer: true
    merge_permission: founder_authorized_only
    formal_guardian: false
    independent_review_vote: false
    responsibilities:
      - 唯一常规落盘写入者
      - Checker、Fixtures、Report、Receipt
      - 候选 Commit、分支与 PR
      - Founder 批准后合并
    forbidden:
      - 未经 Founder 批准合并 main
      - 修改产品合同语义而不经 Founder 裁决
      - 担任同一任务的 Guardian
  - role_id: CLAUDE_INDEPENDENT_GUARDIAN
    display_name: Claude 独立 Guardian
    human: false
    final_authority: false
    repo_read_permission: true
    repo_write_permission: false
    formal_guardian: true
    planning_context_access: false
    candidate_edit_permission: false
    independent_review_vote: true
    independent_review_vote_count: 1
    responsibilities:
      - 只审查冻结 Commit
      - 给出 PASS / CONDITIONAL / BLOCK 与证据
    forbidden:
      - 参与规划
      - 参与施工
      - 参与修复
      - 参与产品重新设计
      - 读取规划上下文
      - 编辑候选
  - role_id: CLAUDE_PLANNING_AND_VERIFICATION_SURFACE
    display_name: Cowork 规划与核验工作面
    human: false
    final_authority: false
    repo_read_permission: true
    formal_repository_write_permission: false
    formal_guardian: false
    independent_review_vote: false
    responsibilities:
      - 形成规划建议
      - 形成核验意见
      - 生成文档或审查产物供 Founder 审阅
      - 为 Claude Planner 提供输入
      - 对 Codex 交付形成非正式预检查
    forbidden:
      - 直接写正式产品真源
      - 直接修改主仓活基线
      - 在参与规划、文档生成或修复后担任同一任务的正式 Guardian
      - 把其核验意见表述为外部独立审查
      - 绕过 Codex 成为常规仓库写入者
    downstream_flow: Cowork产物 → Founder确认 → Codex落盘 → 正式Checker → 独立Guardian

