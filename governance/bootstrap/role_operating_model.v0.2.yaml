  - 把 AI 评审冒充外部专家
  - 把 Founder 自评冒充独立法律意见
  - 在未完成基线对账时修改产品真源
  - 在 v1.2 生效前归档 v1.1
  - 在 Founder 批准前合并 main
  - 使用「最新版」代替 Commit 哈希
  - 静默绕过不可用角色
  - 自行改变 125—185 人月与 15—24 个月基线
  - 改变 M0 十四项清单
