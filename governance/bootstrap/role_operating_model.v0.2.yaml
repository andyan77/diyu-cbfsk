review_mode:
  mode: FOUNDER_PLUS_ISOLATED_AI
  external_human_review: false
  external_legal_opinion: false
  independent_external_validation_completed: false
  domain_review_type: founder_self_review_with_ai_adversarial_support
  legal_review_type: founder_compliance_self_assessment
  forbidden_claims:
    - 把多个 AI 评审称为多个外部专家
    - 把 Founder 自评称为独立法律意见或律师意见
    - 把内部一致性表述为外部专家共识
  metrics:
    renamed:
      from: 匹配品类专家通过率
      to: internal_review_panel_pass_rate
    required:
      - ai_reviewer_disagreement_rate
      - founder_override_rate
      - founder_sample_review_rate
      - high_risk_founder_full_review_rate
  risk_tiered_review:
    high_risk_topics:
      - 童装安全
      - 青少年身体与年龄适当性
      - 运动功能与安全
      - 隐私与个人信息
      - 品牌硬规则
      - 可能构成法律、医疗或性能承诺的内容
    high_risk:
      founder_review_coverage: "100%"
      sampling_allowed: false
    medium_and_low_risk:
      founder_review: stratified_sampling
      ai_review: multi_reviewer
      checker_review: deterministic
      sampling_ratio_frozen_at: M2
  reviewer_calibration_contract:
    canonical_name: reviewer_calibration_contract
    legacy_compatible_name: rater_calibration_contract
    must_contain:
      - Founder 标定锚点题
      - AI 评审员盲评
      - AI 评审分歧率
      - Founder 覆盖与推翻记录
      - 模型版本变化后重新标定

