task_classification:
  L1:
    name: 轻量编辑任务
    allowed_scope:
      - 错别字
      - 标点
      - 无语义格式修复
      - 已有编号的机械同步
      - 链接或索引修正
      - 不改变合同含义的版式修复
    forbidden_scope:
      - 产品范围
      - 能力
      - 角色
      - 状态
      - 阈值
      - 风险
      - Schema
      - 安全
      - 合规
      - CI
      - 知识晋级
      - 发布
      - 隐藏评测
    flow:
      - Planner 提出 L1
      - Founder 确认 L1
      - Codex 修改并运行确定性 Checker
      - Founder 批准具体 Commit
    advisor_and_guardian: founder_may_decide_whether_to_enable
  L2:
    name: 标准工程任务
    scope:
      - 已冻结合同内的实现
      - 无产品语义变化的 Schema 与 Checker 施工
      - 常规测试与报告
    flow:
      - Planner
      - Founder 批准任务包
      - Codex
      - Guardian
      - PR
      - ChatGPT 顾问审查
      - Founder 批准
      - 合并
  L3:
    name: 关键治理与高风险任务
    scope:
      - PRD
      - 角色与权限
      - 知识状态
      - 隐藏评测
      - 安全
      - 合规
      - 发布门
      - 模型切换
      - 知识晋级
      - Commercial 版本
      - 主仓治理
    must_not_skip_without_explicit_founder_waiver:
      - 独立 Guardian
      - ChatGPT 总顾问远程审查
      - Founder 具体 Commit 批准
  current_task_class: L3

