  wrote_verbatim: 本台账没有机器守卫。
  why_replaced: >-
    那一版按当时的口头指令做成 doc-only，自述「封存靠人遵守，不靠判据拦阻」。
    本裁决第二节把口径改成「一律以机器状态封存，不以意图封存」，并在 SEAL-1 明文要求判据，
    因此本版补上 ci/checkers/check_m2_suspension_seal.py，doc-only 形态就此作废。
  what_was_kept: 该版记录的事实（被封各项的状态、四项 PARTIAL 的阻断源、封存时的自检与远程 CI 结果）经复核属实，予以保留并扩写。
  what_was_corrected:
    field: review_status_at_seal.why_review_cannot_start_now
    old_claim: 分发前五步闸中 Guardian Delta 是第 4 步，第 3 步的最终分发前候选尚不存在，Delta 没有审查对象。
    why_now_wrong: >-
      本裁决第三节把审查对象改为「本次结扎落盘后形成的最终候选 Commit」——该对象在本包提交后即存在。
      旧结论对旧对象成立，对新对象不成立；留着不改会让人以为审查仍然启动不了。

suspension_reason:
  headline: Founder 主动挂起，既非通过、亦非失败。
  verbatim: 性质：既非通过、亦非失败，为 Founder 主动挂起。M2 冻结门维持关闭。
  what_it_is_not:
  - 不是 M2 失败——18 项里 14 项 READY，无一项被判不合格
  - 不是 M2 通过——4 项 PARTIAL、0 项 FROZEN、阈值一条未冻、三方审查均未进行
  - 不是放弃——封的是推进动作，不是结论
  plain: >-
    M2 的图纸基本画完了，实物差一批，而差的那批全卡在同一个前置上（隐藏侧存储未 provision）。
    Founder 选择在这里停手、把当前状态钉死、把主线封存，而不是硬推到冻结。

