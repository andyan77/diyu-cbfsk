  - {step: 3, action: 分发并回收两侧评审, owner: FOUNDER_PRODUCT_AUTHORITY}
  - {step: 4, action: 聚合, owner: 执行侧}
  - {step: 5, action: Founder 冻结阈值（COND-007 关闭）, owner: FOUNDER_PRODUCT_AUTHORITY}
  - {step: 6, action: Founder 确认公开蓝图未变（绑定 Commit）, owner: FOUNDER_PRODUCT_AUTHORITY}
  - {step: 7, action: STORE-A provision 与证据 intake, owner: FOUNDER_PRODUCT_AUTHORITY}
  - {step: 8, action: 40 品牌正式批, owner: 执行侧}
  - {step: 9, action: 统一收口, owner: 执行侧}
  step_count: 9
  minimum_actions_note: >-
    这是**最小**动作清单——每一步都不可跳过，也没有任何一步可以由执行侧代替 Founder 完成。
    第 1、3、5、6、7 步归 Founder；第 2、4、8、9 步归执行侧，且各自都以前一步为前置。
  must_not_assume_true_on_restore:
    count: 2
    items:
    - id: MNA-1
      verbatim: 任何一条上述前置
      meaning: 恢复时不得因为「上次好像做过了」而跳过任何一步；每一步都要重新取现场证据。
    - id: MNA-2
      verbatim: 挂起期间主线的任何变化不自动使输入包保持有效
      meaning: >-
        主线在挂起期间即使只落了治理登记，隐藏生成输入包的血统基线也可能已经不再对得上。
        恢复时必须重算输入包哈希并重新确认，不得沿用挂起前的那一份。
      state_source: 03_m2_evaluation_foundation/steward/hidden_generation_input_bundle.v1.1.0.yaml

unseal:
  authority: FOUNDER_PRODUCT_AUTHORITY
  rule: 任一项解封须 Founder 裁决具名该项；执行侧不得自行判定解封条件已满足。
  failure_state: UNSEAL_WITHOUT_FOUNDER_RULING

what_this_seal_does_not_mean:
- 不表示 M2 已交付——18 项中 4 项 PARTIAL、0 项 FROZEN
- 不表示 M2 已通过任何一方审查——Guardian／总顾问／Founder 三方均未出结论
- 不表示已落盘 14 项可被下游消费——m2_frozen 仍为 false，阈值一条未冻
- 不表示被封各项已被放弃——封的是推进动作，不是结论
- 不表示主线已合并——三门未齐备，PR #3 仍 OPEN

