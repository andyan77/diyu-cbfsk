restore:
  authority: DIYU-CBFSK-FOUNDER-M2-SUSPENSION-001 article_5_restore_conditions
  ordered_sequence:
  - {step: 1, action: 处置第二节第 2 项三个已知缺口, owner: FOUNDER_PRODUCT_AUTHORITY, state_source: 03_m2_evaluation_foundation/calibration/known_design_gaps.v0.1.yaml}
