suspension_reason:
  headline: Founder 主动挂起，既非通过、亦非失败。
  verbatim: 性质：既非通过、亦非失败，为 Founder 主动挂起。M2 冻结门维持关闭。
  what_it_is_not:
  - 不是 M2 失败——18 项里 14 项 READY，无一项被判不合格
  - 不是 M2 通过——4 项 PARTIAL、0 项 FROZEN、阈值一条未冻、三方审查均未进行
  - 不是放弃——封的是推进动作，不是结论
  plain: >-
    M2 的图纸基本画完了，实物差一批，而差的那批全卡在同一个前置上（隐藏侧存储未 provision）。
    Founder 选择在这里停手、把当前状态钉死、把主线封存，而不是硬推到冻结。

