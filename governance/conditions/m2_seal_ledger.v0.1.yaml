    state: M1 PASS（FOUNDER_ACCEPTED）
    changed_by_this_seal: false
  candidate:
    branch: candidate/m2
    delivery_state_frozen_at: a4be75e5ee723fe552a293d40632405711920554
    delivery_state_note: >-
      a4be75e 是被封存的**交付态**：M2 的全部产物字节以该 Commit 为准。
      其后的提交只加封条，不改任何交付物。
    seal_commit_chain:
    - {commit: f71617eee44a6008d8180fe81aeea901efc54816, what: 第一版 doc-only 封口台账}
    - {commit: 9b60bda06f372467243de36982c16d4bd6afea8d, what: 七项结扎、判据与审查转达件（并入前审查 R1 的对象）}
    - {commit: null, what: 本版——按并入前审查结论定点修复 B-01~B-04 / COND-GUARD-M2-01 / NB-1 / OI-SEAL-01,
       commit_binding: derived_from_git_head}
    placeholder_forbidden: true
    placeholder_forbidden_by: DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001 article_3_b02_two_definitions_of_review_target B-02-1
    self_reference_handling: >-
      本文件所在的那个提交，其哈希由本文件的内容算出，写不进来。此前这里写 RESOLVED_AT_REPORT_TIME——
      一个看起来像值的字符串，读者与判据都可能把它当成已解析。现在改为 commit: null ＋
      声明 commit_binding: derived_from_git_head，由判据现算 `git rev-parse HEAD` 补上。
      留空是「这里没有值，去问 git」；占位是「这里有个值，只是还没算」——后者会骗人。
  pr:
    number: 3
    state: OPEN
    must_not_merge_before_three_gates: true

