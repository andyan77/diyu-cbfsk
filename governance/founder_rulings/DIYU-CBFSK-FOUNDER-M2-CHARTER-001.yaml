verbatim_ruling: >-
  采纳顾问方案及Cowork四条修正。当前M1继续执行，不修改已冻结候选；M1收口后、M2最终冻结前，设置一个非正式里程碑的L2跨阶段架构桥接包，以组合式公共元数据信封承接M1
  Schema，并完成六份最小ADR。项目采用包含叙事与人设平面的六层架构；商业楔子默认内容先行、API第二步，商业交付形态在M10通过后、M11设计冻结前由Founder裁决。ADR必须声明最小实现、落地里程碑、当前不建设和激活条件；Billing、开发者门户和Marketplace在商业形态裁决前不得建设。基线锦标赛同时衡量质量、成本、延迟与人工干预。项目永久坚持造型理解与身份识别解耦，不建设人脸身份识别、验证、模板存储或跨会话面部关联能力。竞品市场事实按候选证据治理，未经核验不得进入正式产品合同或对外宣称。补充裁决：桥接内容不再作为独立L2任务或M1.5节点执行，统一并入M2。M2采用一份Milestone
  Plan、三个执行包和一次最终收口：M2-EP01完成M1→M2公共元数据信封、六份最小ADR、身份识别隔离及评测治理基础；M2-EP02完成评分卡、基线锦标赛与隐藏评测资产；M2-EP03完成集成、冻结、回归、Report和Receipt。M1当前执行不中断，M1已冻结领域Schema不得原位修改；M2通过组合式Envelope/Profile消费M1产物。EP01完成后只运行确定性内部Checker，不单独进入Guardian、总顾问和Founder审查；三个执行包全部完成后，对最终候选Commit统一进行一次Guardian、一次总顾问审查和一次Founder裁决。若桥接实施要求改变M1顶层对象、核心语义、事实优先级或品类合同，则立即停止并提交Founder裁决，不得在M2内部静默修改。

