milestone_plan_m2:
  plan_id: MILESTONE_PLAN_M2
  plan_version: 1.1.0
  goal: 评测治理与评分体系，并入架构桥接内容（Envelope/Profile、六份最小 ADR、身份隔离、评测治理基础）
  structure:
    milestone_plan: 1
    execution_packages: 3
    unified_closeout: 1
  packages:
    - id: M2-EP01
      status: DISPATCHED
      scope: M1→M2 公共元数据信封（PROVISIONAL）+ 六份最小 ADR + 身份识别隔离 + 评测治理基础
    - id: M2-EP02
      status: NOT_DISPATCHED
      scope: 受控合并至 M1 最终收口 → Profile 最终绑定+重测 → 评分卡 + 基线锦标赛 + 隐藏评测资产
      start_precondition: M1 收口合入 main
    - id: M2-EP03
      status: NOT_DISPATCHED
      scope: 集成 + 冻结候选 + 回归 + Report + Receipt
      irreversible_package: true
      additional_approval_required: Founder 精确 Prompt 批准
      basis: DIYU-CBFSK-FR-GRANULARITY-005 additional_exact_prompt_approval_required
  review_arrangement:
    per_package: 仅运行确定性内部 Checker
    per_package_guardian_review: false
    per_package_advisor_review: false
    per_package_founder_review: false
    at_final_candidate:
      guardian_review: 1
      advisor_review: 1
      founder_decision: 1
    hidden_asset_freeze_effective_from: Founder 收口签署
  founder_touchpoints:
    count: 2
    detail:
      - 本签署（Milestone Plan + Envelope 批准）
      - 收口裁决
    additional: M2-EP03 精确 Prompt 批准（不可逆包附加批准）
    consistent_with: DIYU-CBFSK-FR-GRANULARITY-005 founder_touchpoints.per_milestone=2
  adr_titles:
    - {id: ADR-001, title: 六层架构与边界}
    - {id: ADR-002, title: Model Provider Abstraction}
    - {id: ADR-003, title: Tenant/Scope 与 M1→M2 组合消费}
    - {id: ADR-004, title: 隐私与身份隔离}
    - {id: ADR-005, title: 评测锦标赛与最小可观测性}
    - {id: ADR-006, title: Canonical Connector 边界}
  non_adr_records:
    rationale: >-
      「商业楔子」与「竞品治理」两项自 v1.1 起改为非 ADR 记录，内容不丢失：
      商业形态是可撤销的业务假设、竞品事实是证据治理政策，二者都不是不可逆技术决策，
      写成 ADR 会把业务假设伪装成架构约束。
    records:
      - {id: commercial_decision_record, landed: 03_m2_evaluation_foundation/commercial_decision_record.v0.1.yaml}
      - {id: competitive_evidence_policy, landed: 03_m2_evaluation_foundation/competitive_evidence_policy.v0.1.yaml}

