article_3_four_adjudications:
  - id: ADJ-1
    subject: 隐藏资产
    decision: OPT-1
    verbatim: >-
      采纳 OPT-1。Founder 已在另一账号、另一台电脑 provision 私有隐藏资产仓库（STORE-A），
      设任务级角色 FOUNDER_HIDDEN_BENCHMARK_STEWARD；资产生成时点在工作面 A 冻结生成合同之后，不得提前。
    generation_timing_constraint: 工作面 A 冻结生成合同之后，不得提前
    landed_effect:
      cond_011_status: EVIDENCE_SUBMITTED
      cond_011_not_closed_reason: 三项关闭要件中执行侧只掌握 founder_attestation 一项
      semantics_record: governance/conditions/m2_condition_state_semantics.v0.1.yaml cond_011
  - id: ADJ-2
    subject: OD-M2-01 真实基线运行
    decision: DEFERRED_TO_POC_OR_M10
    verbatim: >-
      延后至 POC 或 M10，当前保留确定性 dry-run。理由：完整决策系统尚未成型，
      此刻的真实锦标赛只能测出通用模型之间的差异，无法证明笛语相对基线的优势。
    landed_effect: 锦标赛 dry-run 保持确定性骨架；本包未发生任何真实模型 API 调用。
  - id: ADJ-3
    subject: OI-01 三层哈希
    decision: no_retirement
    verbatim: >-
      维持三层，正式改判 no_retirement，撤销 ADJUDICATED_NOT_IMPLEMENTED 的挂起状态
      （理由：L2/L3 无等效替代）。
    supersedes: DIYU-CBFSK-FR-CALIBRATION-004 中「三层哈希机制退役」的 ADJUDICATED_NOT_IMPLEMENTED 挂起态
  - id: ADJ-4
    subject: COND-007 阈值
    decision: MUST_FREEZE_BEFORE_M2_PASS
    verbatim: 须在 M2 通过前完成校准并冻结；校准一律使用公开校准集，严禁用隐藏集调参。
