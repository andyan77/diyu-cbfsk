article_d_repair_scope:
  title: M1 收口修复任务——唯一一个最小修复 Commit，范围锁死，全部在 m1/candidate-freeze 分支
  permitted_items:
    - id: D1
      item: CI 依赖修复
      requirement: 新增 requirements-ci.txt（含 jsonschema，版本与 M1 本地验证环境一致），三个 workflow 统一从该文件安装
      conditional_clause: 若实测根因与「缺 jsonschema」不符，按实测做最小修复并在报告说明，不得扩大范围
    - id: D2
      item: 审查对象口径修正
      requirement: >-
        分离两个概念——semantic_candidate_commit ＝ 37f636c73dac1be7457dfc951984b43532056804（33 份交付物字节快照）；
        review_package_head ＝ 本次修复后的最终 PR Head。supersession 措辞改为「最终 Guardian review target
        之后的任何新 Commit 使 Guardian 与总顾问结论失效」。PR 正文、Receipt、Guardian 交接包同步该口径。
    - id: D3
      item: 本裁决落盘
      requirement: A／B／C 三节作为 Founder 裁决记录（A.2 追认条目须含三个提交的完整 40 位哈希）＋ FR-PROCESS-006 澄清行 ＋ Open Item 逐项状态
    - id: D4
      item: 禁止事项（顾问清单原文执行）
      forbidden:
        - 不改 M1 对象语义
        - 不改五品类合同
        - 不改事实优先级
        - 不新增 M2 资产
        - 不开始桥接 Schema
        - 不在本分支触碰 m2 状态位
        - 不改知识状态
        - 不生成隐藏题或夹具品牌
    - id: D5
      item: 完成后 CI
      requirement: >-
        远程三个 Actions 全量重跑，必须全部成功（不得只重跑失败步骤后口头推断其余仍成立）。
        交付报告只报结论：修复内容清单、三个工作流全绿证据、最终 PR Head 完整 40 位哈希。

