      landed: PRD 附录B 术语表

D-29:
  title: M6 反退化验收（Anti-Degeneration）
  status: FOUNDER_DECIDED
  decision: >-
    M6 搭配决策编译器不得实现为「将已接受知识注入 Prompt/RAG 后由 LLM 端到端直接作答」的单层结构。
    硬约束执行（库存/品牌/品类/安全/用户拒绝项）、候选生成与排序必须是确定性、可审计的步骤；
    LLM 用于语义解析、解释与叙事生成，不得作为硬约束的唯一执行者。
  anchors:
    - anchor_id: D29-01
      milestone: M6
      requirement: 通过标准与 compiler qualification report 增加架构符合性检查三条
      checks:
        - 硬约束由确定性代码执行且可用 fixtures 单测
        - LLM-off 不变性：关闭 LLM 解释/生成组件后，约束过滤与候选排除结果不变、可重放
        - DecisionTrace 可显示每个排除项由哪条确定性规则触发
      landed:
        - PRD 13 M6 目标
        - PRD 13/14 M6 交付物 architecture_conformance_check_report
        - PRD 13/14 M6 交付物 llm_off_invariance_replay_fixtures
        - PRD 13/14 M6 通过标准
    - anchor_id: D29-02
      scope: CI fixtures
      requirement: 新增 negative fixture——纯 Prompt/RAG 直答实现通过 M6 必须 FAIL
      landed: ci/fixtures/negative/m6_prompt_rag_direct_answer.yaml + ci/checkers/check_task_classification.py 无关；由 check_m6_anti_degeneration 断言
    - anchor_id: D29-03
      section: "11.1"
      requirement: 组件注记同步
      landed: PRD 11.1 ConstraintEngine / StylingRanker / DecisionTraceEngine
    - anchor_id: D29-04
      scope: 任务边界
      requirement: 不另立「四范式架构审计」任务，本验收条款承接该关切
      separate_architecture_audit_task_created: false
