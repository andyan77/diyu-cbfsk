version_strategy:
  prd_v1_1_status: VERIFIED_UNSIGNED_BASELINE
  prd_v1_1_must_not_be_signed_now: true
  next_product_truth_version: PRD_v1.2
  version_strategy: CONSOLIDATE_ALL_PENDING_RULINGS_AND_SIGN_V1_2_ONCE
  execution_meaning:
    - PRD v1.1 修正版作为已核验、未签署的输入基线。
    - 不再先签 v1.1。
    - 在 v1.1 基础上合并全部已确认但尚未落入远程产品真源的 Founder 裁决。
    - 生成可独立阅读的 PRD v1.2 全文。
    - Founder 只对完整 v1.2 作一次正式签署。
    - v1.2 生效前 v1.1 仍是远程当前活基线，状态保持 PENDING_FOUNDER_SIGNATURE。
    - v1.2 生效后 v1.1 转入历史归档。
  forbidden_sequence: 先签一个已被后续裁决部分推翻的 v1.1，随即再创建 v1.2

