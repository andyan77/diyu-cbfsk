founder_patches:
  - patch_id: PATCH-01
    ruling: D-23 为对 D-12 的部分改判
    text: 品牌专属数据库仍为权威事实来源；多模态视觉推断按 authoritative > human_confirmed > model_inferred 分层引入，推断不得覆盖权威事实，不得推断成分、性能、库存与安全认证。
    anchors: [PRD 3.2 非目标, garment_and_inventory.schema.attribute_provenance, PRD 5.6, PRD 11.1]
    status: APPLIED
  - patch_id: PATCH-02
    ruling: D-25 为对 D-13 的改判
    text: V1.0 默认人工审核在环；自动发布仅在 Founder 按租户/品牌/账号/风险级别显式授权后开启，须具备审计、撤回与 Kill Switch；FR-17 与「人工可发布率≥75%」质量门保留不变。
    anchors: [PRD 3.2 非目标, PRD 7/FR-28, PRD 10 硬门, PRD 11.1]
    status: APPLIED
  - patch_id: PATCH-03
    ruling: D-17—D-29 合并规则，禁止浮动条文
    text: 每项裁决须落到具体锚点；v1.2 核验回执须对新增内容重跑「目标→FR→门→里程碑」追溯检查。
    anchors: [PRD 5.2 末尾合并规则段, PRD_v1.2_核验回执 一致性核验表]
    status: APPLIED

