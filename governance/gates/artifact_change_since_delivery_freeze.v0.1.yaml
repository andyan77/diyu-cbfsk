absolute_claim_scan:
  purpose: 撤销一句话不等于它从仓里消失。判据现场全仓搜这几个串，防它在别处复活。
  phrases:
  - 零字节改动
  - 未改任何 M2 交付物字节
  - 未改任何交付物字节
  scan_extensions: ['.md', '.yaml', '.yml', '.tmpl']
  exclusions:
  - governance/gates/artifact_change_since_delivery_freeze.v0.1.yaml
  - governance/founder_rulings/DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001.yaml
  - governance/reports/m2_premerge_review_request.v0.1.yaml
  exclusions_why: >-
    这三处是**记录撤销这件事**的地方：缺陷登记册、认定该缺陷的裁决、以及登记 retracted_claim 的请求件。
    把原话引出来正是它们的职责；扫到它们等于因为病历上写着病名就判病人有病。
  directory_exclusions:
  - ci/fixtures/
  directory_exclusions_why: >-
    夹具**必须**写得出违规串，否则 ABSOLUTE_UNCHANGED_CLAIM_PRESENT 这条判据无从被行使（EQ-3）。
    夹具里的字符串是喂给 validate() 的输入数据，不是本仓对外的声明——
    与 check_m2_identity_isolation 排除自己的 scan_cases 目录同源。
  exclusions_discipline: >-
    文件级豁免逐条列名，不用通配——通配一开，下一份文件就能靠改名混进来。
    唯一的目录级豁免是夹具目录，理由如上，且夹具本身另由 run_fixtures 逐条断言行为。

failure_states:
- CHANGED_FILE_LIST_MISSTATED
- DELIVERY_ARTIFACT_SEMANTICS_CHANGED
- ABSOLUTE_UNCHANGED_CLAIM_PRESENT
