    - 11_reports_and_receipts/m2_seal/m2_seal_delivery_receipt.yaml
  - claim: 'artifacts_rewritten: 0'
    kind: 同源的绝对表述
  why_retracted: >-
    它是绝对的，而事实不是。自 a4be75e 起确有既有文件被逐字节改写。
    执行侧当时想说的是「交付语义没变」——那句话是对的；但写出来的是「零字节改动」，
    那句话是错的。审查方按写出来的那句话去核，核出不符，于是整份声明的可信度一起塌。
  the_lesson: >-
    绝对表述（零、全部、任何、从未）只要有一个反例就整句失效。
    描述事实要用可复算的范围与分类，不要用听起来更有力的绝对量词。

