rule:
  statement: EQ-3 要求每条判据都有一份 expected=FAIL 的夹具行使它。本册登记的是尚未行使的存量错误码。
  ratchet: max_uncovered_codes 必须等于 entries 条数，且只能降不能升。
  new_checker_rule: 新增 checker 必须自带全覆盖，不得往本册加条目——上限不为新债让路。
  repayment_rule: 补上一条夹具就必须从本册删掉对应条目，否则判 STALE_COVERAGE_EXEMPTION。
  why_not_all_at_once: 153 条存量分布在 27 个既有 checker 上，逐条补齐需要为每个 checker 重建完整合法 payload；本包按 Founder「逐一补齐或登记」的授权先登记挂账并装上棘轮，把「看不见的欠账」变成「看得见且只能减少的欠账」。已补齐的是本包自己新增的判据——新增部分零欠账。
measurement:
  method: 实跑：扫描注册表内每个 checker 源码取声明码，再把全部 expected=FAIL 夹具喂给对应 validate() 收集实际触发码，取差集。
  evidence_level: runtime_verified
  measured_by: ci/checkers/check_error_code_fixture_coverage.py
  measured_at_package: M2-EP05
  declared_codes_total: 573
  fail_fixtures_run: 440
  covered_codes: 426
  uncovered_codes: 147
measurement_history:
  purpose: >-
    measurement 是「现在这一刻」的实测值，会随判据增加而变。
    报告要引的是它当时那一刻的值——把历史报告接到 measurement 上，
    报告的内容会随后续施工悄悄改变，那不是报告，是仪表盘。
  entries:
    - measured_at_package: M2-EP04
      measured_at_commit: cffa6ccba2abf3c67b06e358dc33aa5d051e7868
      evidence_level: runtime_verified
      declared_codes_total: 523
      fail_fixtures_run: 385
      covered_codes: 376
