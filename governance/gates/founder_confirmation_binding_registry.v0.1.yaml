permanent: true
rule:
  verbatim: 凡表示「Founder 已确认／已批准／已授权／已签署」的字段，一律不得是执行侧可写的裸布尔值；必须绑定：具名裁决文件（存在且条款路径可解析）＋ 完整 40 位签署基线 Commit ＋ 签署人 ＋ 签署时点。
  why: 本轮的洞不是一个文件写漏了，是一类字段的设计缺省——被守的一方自己就能开门。
  plain: 一个 false 改成 true 只要一次键盘操作，事后也看不出是谁在哪个版本上确认的。要求它挂上具名文件、条款、完整哈希、人和时间，是为了让「谁说的」这件事有地方查。
scan_scope:
  globs:
  - '**/*.yaml'
  excluded_prefixes:
  - ci/fixtures/
  excluded_reason: 夹具是给判据喂的字面量，不是本仓对外的声称。
  narrowing_rule: 扫描范围只可扩大，不可收窄；收窄即 CONFIRMATION_SCAN_SCOPE_NARROWED。
  key_stems:
  - acknowledge
  - acknowledged
  - approval
  - approve
  - approved
  - attest
  - attestation
  - attested
  - authorization
  - authorize
  - authorized
  - confirm
  - confirmation
  - confirmed
  - confirms
  - sign
  - signature
  - signed
  - signoff
  - witnessed
  value_type: boolean
claim_kinds:
  founder_act_claim: 声称 Founder 做过某个动作。值为 true 时必须有完整绑定。
  requirement: 声称某事需要 Founder 批准。是要求，不是已发生。
  capability: 角色权限位。
  negation: 声称「没有被授权」。
  eligibility: 声称够不够格被签署。由交付状态推导。
  derived_state: 对 git 事实或既有记录的观测结果，可复算。
  discipline_acknowledgement: 承认一条纪律。
  inside_founder_ruling: 字段写在 Founder 亲发的裁决文件里，文件本身即那份具名记录。
  inside_founder_signature_record: 字段写在 Founder 签署回执里，它是被指向的那一端。
binding_required_when:
  claim_kind: founder_act_claim
  value: true
  required_fields:
  - authority_kind
  - authority_ref
  - authority_file
  - authority_clause_path
  - signature_base_commit
  - signed_by
  - signed_at
  authority_file_must_exist: true
  authority_clause_must_resolve: true
  commit_must_be_full_40_hex: true
  resolver: ci/checkers/_common.py clause_resolves（单一实现，裁决引用与本判据共用）
counts:
  sites: 76
  kind_capability: 1
  kind_derived_state: 5
