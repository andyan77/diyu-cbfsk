contract:
  general_rule: 任何现役门禁的摘除或降级均为独立治理动作，须 Founder 单独授权，永不作为其他任务的副作用。
  purpose: 本册是「当前有哪些现役门禁」的唯一登记处。ci/checkers/check_m2_gate_retirement_guard.py 把它与 ci/run_all_checks.py 的注册表双向比对：册子里写着
    LIVE 却不在注册表里，就是有门禁被摘掉了；在注册表里却没登记，就是有门禁没进册子。
  why_needed: OI-01 之前，摘掉一个 checker 只需从 run_all_checks 删一行——没有任何判据会发现。「不得静默降级门禁」在此之前只是一句承诺，本册让它变成可被机器发现的事实。
  retirement_procedure:
  - 1. Founder 单独授权（独立治理动作，不得夹带在其他任务里）
  - 2. 本册对应条目 status 改 RETIRED，并填 retirement_authorization（裁决 ID + 完整 Commit 哈希 + 替代覆盖）
  - 3. 才可从 run_all_checks 注册表移除
  downgrade_equals_retirement: 削弱判据（放宽阈值、去掉分支、改成只警告不失败）与摘除同等对待，一律须单独授权。
