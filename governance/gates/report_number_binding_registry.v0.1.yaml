established_at_package: M2-EP05
finding: NB-M2E4-03
purpose: 报告里的计数数字必须追得到某个机器记录字段。EP04 报告写 500/350/149 而台账实测 523/376/147， 三个数字彼此还对不上（500−350≠149）——根因不是抄错一次，是数字与台账之间根本没有连线。
rule:
  statement: 报告一律改为引用台账 measurement 字段，由生成时读取。
  mechanism: 报告写成模板（*.md.tmpl），数字位写 {{ref:<路径>#<点分键路径>}}；判据重渲染后与落盘报告逐字节比对。
  why_not_just_fix_the_numbers: 抄一遍正确数字只解决这一次。台账下次一变，报告又回到「看着像真的但没人再核过」的状态。 连上线之后，改数字这件事只能发生在台账里。
  count_units_in_scope:
  - 项
  - 条
  - 例
  - 份
  - 道
  - 张
  - 格
  - 个
  - 类
  - 批
  - 轮
  - 次
  - 品牌
  - 商品
  - 图像
  - 阶段
  - 处
  allowlist_discipline: 确实不是测量值的数字（历史引述里的原始数字、条款序号、比例说明）逐条登记并写明理由。 白名单是公开可数的——判据看不见就算过，等于没有规则。
effective_from_package: M2-EP05
retroactivity:
  templated_retroactively:
  - 11_reports_and_receipts/m2_ep04/m2_ep04_delivery_report.md
  templated_retroactively_reason: EP04 报告是本条发现的直接对象，裁决第三节点名要求改；其余既往报告不回改， 理由与 STOP 分栏规则同源：为满足一条后立的格式规则去回改历史报告，等于用今天的口径重写昨天的现场。
discovery:
  globs:
  - 11_reports_and_receipts/*_delivery_report.md
  - 11_reports_and_receipts/*/*_delivery_report.md
  - governance/reports/*_review_request.md
  note: 判据按本 glob 自动发现交付报告；发现了却没登记即 REPORT_NOT_REGISTERED，新报告不能悄悄绕开本册。
  glob_extension_nb1:
    authority: DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001 article_7_nb1_transmittal_number
    verbatim: 转达件「47 个判据」更正为实测值；转达件 .md 纳入 report_number_binding_registry 覆盖面
    what_was_wrong: >-
      转达件写着「47 个确定性判据全绿」，而当时实测 48 个。它是发给两侧评审的文件——
      转达件里的数字与交付报告里的数字，可信度要求没有区别，此前却只有后者被本册覆盖。
      加 glob 而不是只加一条登记：下一份转达件才不会再次绕过。
