why_this_file_exists:
  finding: B-01-4
  verbatim: >-
    将 scan_coverage_record.current 从产品合同移出，另立治理测量台账。
    冻结合同不得随仓库新增文件而必须改数字——那不是合同，是伪装成合同的实时仪表盘
  what_went_wrong: >-
    覆盖面数字原先住在 03_m2_evaluation_foundation/identity_isolation/identity_capability_isolation_contract.v0.1.yaml
    的 scan_coverage_record.current 里。那份文件是**冻结的产品合同**：它规定「哪五项能力永不建设、
    扫描扫什么面、不扫什么面」。而覆盖面数字每加一个文件就要改一次——本包施工期间它从 790 一路往上走。
    结果是每次施工都得改一次冻结合同，改的还是与合同语义完全无关的一个计数。
  the_distinction: >-
    合同说的是「规则是什么」，台账记的是「上次量出来多少」。前者变了要走治理流程，后者变了是正常的。
    把后者塞进前者，等于让每一次例行测量都表现为一次合同修订——久而久之，真正的合同修订就淹没在噪音里。
  what_stayed_in_the_contract: 规则本身、扫什么面不扫什么面、以及一个指向本册的指针。

rule:
  statement: 覆盖面数字一律是记录值，不是文中随手写的数。
  current_value_rule: 当前值由判据 collect() 现算比对；台账里的 declared 与现算不等即 SCAN_COVERAGE_COUNT_MISSTATED。
  history_rule: 历史值绑定它被测出来的那个完整 40 位提交，且必须标 evidence_level=runtime_verified。
  who_may_change: 执行侧可随施工更新本册 current；合同本身的修订仍是治理动作。

