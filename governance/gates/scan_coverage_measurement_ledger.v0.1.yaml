two_readings_discrepancy:
  finding: B-01-3
  verbatim_requirement: >-
    两个审查方对同一字段实测值不同（Guardian 757、总顾问 790）——执行侧须现场复算并如实登记实测值，
    同时记录「两方读数不同」这一事实及其成因（很可能是两方读的提交不同）
  readings:
  - reader: CLAUDE_INDEPENDENT_GUARDIAN
    value: 757
    matches_commit: f71617eee44a6008d8180fe81aeea901efc54816
    package: M2-SEAL（doc-only 封条那一版）
  - reader: CHATGPT_CHIEF_ADVISOR
    value: 790
    matches_commit: 9b60bda06f372467243de36982c16d4bd6afea8d
    package: M2-SEAL
  cause: 两方读的不是同一个提交。
  cause_evidence_level: runtime_verified
  cause_method: >-
    本册 history 里 757 与 790 各自绑定的提交都可复算：
    `git show f71617e:03_m2_evaluation_foundation/identity_isolation/identity_capability_isolation_contract.v0.1.yaml`
    给出 757，`git show 9b60bda:...` 给出 790。两个数字各自对它所属的提交都是对的。
  neither_reading_was_wrong: true
  what_was_wrong: >-
    错的不是任一方的读数，是这个字段**住错了地方**。它住在一份被当作「冻结合同」引用的文件里，
    于是两个审查方各自在不同时点打开同一个「冻结」文件，读到了不同的数——
    而「冻结」这个词让双方都没想到需要先对齐提交。
  structural_fix: 本册即结构性修复：数字搬进治理测量台账，每一条都绑定它被测出来的提交。

