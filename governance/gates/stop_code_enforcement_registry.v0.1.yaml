schema_version: '0.1'
registry_id: DIYU-CBFSK-STOP-CODE-ENFORCEMENT-REGISTRY
artifact_id: stop_code_enforcement_registry.v0.1
project_id: DIYU-CBFSK-001
established_by: DIYU-CBFSK-FOUNDER-M2-EP05-001 article_2_phantom_stop_code
established_at_package: M2-EP05
finding: NB-M2E4-02
purpose: 每一条被当作 STOP 使用的错误码，都要说清它是「机器会抓」还是「人得判」还是「将来运行时才有得抓」。MULTIMODAL_SCOPE_CONFLICT_WITH_D10 之所以能作为一条 STOP 被写成「未触发」，正是因为此前没有任何地方要求它先证明自己有检测器。
general_rule_permanent:
  statement: 任何声明为 STOP 的错误码，若无检测器实现，一律不得表述为「未触发」。
  authority: DIYU-CBFSK-FOUNDER-M2-EP05-001 article_2_phantom_stop_code
  plain_language: 「未触发」是一句实测结论。没有检测器却说未触发，等于没考试就报及格分——真出了事，谁也说不出它是没发生还是没人看。
  failure_state: PHANTOM_STOP_CODE_DECLARED_NOT_TRIGGERED
enforcement_classes:
- id: machine_checked
  meaning: 有现役判据实现该码，可实测触发与否
  requires:
  - detectors 非空
  - 每个 detector 必须在现役门禁册内 LIVE
  - 码字符串必须真出现在该判据源码里
- id: human_judgement
  meaning: 须由人判断，机器只能记录判断结果
  requires:
  - detectors 必须为空
  - 必须写明由谁判
  must_not:
  - 被表述为「判据实测未触发」
- id: future_runtime
  meaning: 要等产品或隐藏资产实际运行才有可检对象
  requires:
  - detectors 必须为空
  - 必须写明何时才可检
  must_not:
  - 被表述为「判据实测未触发」
report_presentation_rule:
  statement: 报告与回执中的 STOP 表格必须按三类分栏呈现。
  forbidden: 把「人工判断为真」与「判据实测为真」混在同一张表里
  why: 两者的可靠度不同：一个错了会被下一次 CI 抓住，另一个错了只有下一个读到它的人可能发现。
  effective_from_package: M2-EP05
  not_retroactive_reason: 本规则自 EP05 起生效。既往报告是已发生事实的记录，为满足一条后立的格式规则去回改它们，等于用今天的口径重写昨天的现场——与「历史记录只可追加更正、不得静默改写」同一条纪律。
  grandfathered_reports:
  - 11_reports_and_receipts/m1_delivery_report.md
  - 11_reports_and_receipts/m1_ep01_delivery_report.md
  - 11_reports_and_receipts/m2_delivery_report.md
  - 11_reports_and_receipts/m2_ep01/m2_ep01_delivery_report.md
  - 11_reports_and_receipts/m2_ep02/m2_ep02_delivery_report.md
  - 11_reports_and_receipts/m2_ep04/m2_ep04_delivery_report.md
  grandfathering_does_not_cover: 「未触发」通则不豁免：任何报告都不得把无检测器的码写成未触发，EP04 报告里那一条按裁决第二节当场改掉。
  failure_state: STOP_TABLE_NOT_PARTITIONED_BY_ENFORCEMENT
retired_codes:
- code: MULTIMODAL_SCOPE_CONFLICT_WITH_D10
  retired_at_package: M2-EP05
  authority: DIYU-CBFSK-FOUNDER-M2-EP05-001 article_2_phantom_stop_code
  reason: Founder 侧派发件杜撰的停止码：无实现、无夹具，且码名里嵌着一个错误的裁决编号（D-10）。
  replaced_by:
  - MULTIMODAL_SCOPE_EXCEEDS_AUTHORITATIVE_FACT_BOUNDARY
  - MULTIMODAL_EVIDENCE_ORDER_DRIFT
  - MULTIMODAL_FORBIDDEN_ATTRIBUTE_IN_SCOPE
  replacement_naming_rule: 替代码不得含错误编号；边界由 PRD v1.2 正文分层视觉推断条款现场解析。
  must_not_appear_at_any_stop_site: true
counts:
  total_codes: 168
  machine_checked: 77
  human_judgement: 36
  future_runtime: 55
scan_scope:
  keys:
  - current_blocker
  - failure_state
  - single_blocker
  - stop_condition_evaluated
  - stop_condition_id
  - stop_condition_if_violated
  - stop_condition_not_triggered
  - stop_condition_ref
  - stop_id
  note: 本册射程＝「被当作 STOP 使用」的声明位。各合同的 failure_states 词表（复数）由 error_code_fixture_coverage_ledger 另册承接，两册不得互相复述，避免同一件事两套口径。
