finding: NB-M2E4-01

purpose: >-
  仓内出现的每一个 DIYU-CBFSK-* 编号，都要能说清它是哪一类对象、落在哪个文件、由谁签发。
  此前只有「裁决」一类编号被现场核验存在性，任务 ID、Prompt ID、回执 ID 一律不管——
  于是 DIYU-CBFSK-M2-CLOSEOUT-REPAIR-001 被引用 31 次却查无此文件，
  而判据认为一切正常，因为它只看 basis 与 ruling 两个键。

core_distinction:
  statement: 任务 ID 不是裁决 ID，二者不得互相改名。
  authority: DIYU-CBFSK-FOUNDER-M2-EP05-001 article_0_anchors.anchor_2_naming
  plain_language: >-
    「任务 ID」是 Founder 派工时给这件活起的名字；「裁决 ID」是那份签署文件本身的名字。
    一件活可以引用一份裁决，但它们是两个东西——把任务改名成裁决名，等于让派工单冒充签署件；
    把裁决改名成任务名，等于让签署件失去可寻址的落点。
  consequences:
    - 任务 ID 维持 Founder 派发时的原值，不因裁决文件命名规范而改名。
    - 裁决文件维持 FOUNDER- 前缀名（本裁决之后新建者），不因任务 ID 而改名。
    - 任务 ID 通过 dispatched_by 指向真实存在的裁决文件而可解析，不靠自身有同名文件。

kinds:
  - id: founder_ruling
    resolves_to: governance/founder_rulings/<id>.yaml
    file_required: true
  - id: execution_request
    resolves_to: Founder 签署的执行申请文件（DOCX）
    file_required: true
  - id: task_id
    resolves_to: 由 dispatched_by 指向的裁决或执行申请
    file_required: false
  - id: receipt_id
    resolves_to: 仓内回执文件自声明
    file_required: false
  - id: record_id
    resolves_to: 仓内记录/清单/策略文件自声明
    file_required: false
  - id: prompt_id
    resolves_to: 仓内 Prompt 文件自声明
    file_required: false
  - id: superseded_identifier
    resolves_to: 已被改名取代的旧编号，只允许作为历史记录出现
    file_required: false
  - id: fabricated_for_negative_fixture
    resolves_to: 无（故意捏造，用于行使「引用不存在裁决」判据）
    file_required: false
    confined_to_path_prefixes:
      - ci/fixtures/
      - ci/checkers/
      - governance/identifiers/
    confinement_note: >-
      捏造编号只允许出现在三处：行使判据的夹具、说明该判据为何存在的判据源码注释、
      以及本注册表自身。出现在任何治理正文里即为真把它当成了一份裁决。

covered_reference_keys:
  rationale: >-
    NB-M2E4-01 的射程要求：裁决存在性核验须覆盖全部引用位，不止 basis／ruling。
    本清单是判据必须扫到的键名下限；判据实测覆盖键名少于本清单即 FAIL。
  keys:
    - basis
    - ruling
    - ruling_id
    - authority
    - established_by
    - finding
    - authorization_ref
    - authorized_by
    - source_decision_id
    - founder_designation_basis
    - supersedes
    - corrects
    - dispatched_by

scan_scope:
  scanned_top_level_dirs:
    - 00_charter
    - 01_contracts_and_schemas
    - 02_benchmark_manifests
    - 03_m2_evaluation_foundation
    - 11_reports_and_receipts
    - ci
    - governance
    - 工具
  scanned_root_files: [README.md, CLAUDE.md, AGENTS.md, PRD_v1.2_change_map.yaml]
  excluded:
    - {path: 归档_v1.0, reason: 已归档历史文档，其编号空间已冻结，不得被现行判据反向改写}
    - {path: 归档_v1.1, reason: 同上}
    - {path: .git, reason: 版本库内部对象}
    - {suffix: .docx, reason: 二进制文档由 docx 哈希判据另行守}
  narrowing_rule: 缩小扫描范围等同于降级门禁，须单独授权；判据比对本字段，少扫即 FAIL。

