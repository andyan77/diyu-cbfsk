    note: >-
      本条记录的是「未改名」这一处置本身：Guardian NB-M2E4-01 发现该编号被引用 31 次而无同名文件，
      裁决处置为保留两个对象并明确区分——任务 ID 不改名，裁决文件不改名，
      改的是判据：任务 ID 通过 dispatched_by 指向 DIYU-CBFSK-FOUNDER-M2-CLOSEOUT-001 而可解析。
    is_rename: false
    is_rename_note: renamed_from/renamed_to 为 null 表示本条不是一次改名，而是一次「明确不改名」的裁定留痕。

