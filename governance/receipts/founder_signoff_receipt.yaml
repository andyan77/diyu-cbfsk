red_line_manifest:
  contract: >-
    规范源 red_lines 那份散文清单此前无任何守卫——改它不触发任何 checker，投影 drift=0
    只保证投影与源一致，源改了再重生成照样 0（Guardian NB-M0-04）。本块给它加指纹：
    check_role_operating_model 重算 red_lines 的 sha256 与条数并与此处比对，对不上即判漂移。
    改红线必须同时更新本块并具名裁决，因此清单无法被静默编辑。
  count: 20
  sha256: 2c498e38302903fe67a968e69d9407f8014c2b8609b8f3b03186f821fd55365d
  digest_recipe: sha256(utf-8(newline_joined(red_lines)))
  last_changed_by_ruling: DIYU-CBFSK-FOUNDER-M1-GATE-001
  last_changed_commit: 334e69bfdeaabd731a5184fa3958e479d029f69f
  last_change: 「开始 M1 或 M2」→「未经授权开始 M1 或 M2」（一换一，其余 19 条逐字未动）

state_flag_authorizations:
  contract: >-
    本块是状态位门禁的唯一授权源。check_project_state / check_active_product_truth 读取本块：
    任何状态位为 true，必须在此存在 authorized=true 且绑定 signature_base_commit 的条目；
    没有条目、条目未绑定完整 Commit 哈希、或条目缺 basis，一律判失败。
    never_authorizable 内的状态位即使写了授权条目也一律判失败（红线）。
  never_authorizable:
    - production_servable
    - knowledge_distillation_started
  never_authorizable_change_log:
    - ruling: DIYU-CBFSK-FOUNDER-M1-GATE-001
      ruling_date: "2026-08-13"
      moved_out: [m1_started, m2_started]
      moved_to: 签署授权门控
      red_line_wording_now: 未经授权开始 M1 或 M2
      still_never_authorizable:
        knowledge_distillation_started: 至 M2 冻结后另行裁决
        production_servable: 至 M12 发布时另行裁决
      barrier_layer_delta:
        gate_requirements_unchanged: 授权条目须 authorized=true、绑定完整 Commit 哈希、具名 basis，缺一即拦。
        m2_started_before:
          no_authorization_entry: RED_LINE_FLAG_SET（拦）
          compliant_authorization_entry_added: RED_LINE_FLAG_SET（仍拦——须改 checker 源码才能放行）
          barrier_layers: 2
        m2_started_after:
          no_authorization_entry: UNAUTHORIZED_TRUE_FLAG（拦）
          compliant_authorization_entry_added: 放行
          barrier_layers: 1
        honest_conclusion: >-
          本次收缩**确实降低了** m2_started 的屏障层数：由「改本文件无用、须改 checker 源码」
          降为「往本文件加一条合规授权条目即可放行」，且该新增不触发 RED_LINE_LIST_DRIFT
          （该判据只比对收缩后的两条红线位）。这是 Founder 知情裁决
          （DIYU-CBFSK-FOUNDER-M1-GATE-001 第 1 条），不是执行侧自行放宽。
          m2 当前的锁靠的是「没有条目」，不是「不可授权」——两者不是一回事。
      superseded_claim:
        text: 没有条目的状态位判 UNAUTHORIZED_TRUE_FLAG，与先前的绝对禁止等效。
        why_wrong: >-
          「等效」只在「无授权条目」这一前提下成立，执行侧把有条件说成了无条件。
          Founder 裁决原文「m2_started：无授权条目，照样锁死」本就带前提，是转写进本文件时丢了前提。
          本字段原名 why_this_is_not_a_relaxation 预设了结论，一并改为中性的 barrier_layer_delta。
        found_by: CLAUDE_INDEPENDENT_GUARDIAN delta 复核 76a1394ee0ba1fae45fac6225167e431c2cd34d7（RD-01）
