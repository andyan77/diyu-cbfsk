purpose: >-
  「本包候选 Commit 的完整 40 位哈希」此前只出现在报告正文里，没有落成机器可读字段。
  引用位（TG-05 的冻结 Commit、Delta 复审对象、血统基线）因此各自抄一遍，抄错一处无人能发现。
  本册是 M2 各执行包候选 Commit 的唯一登记处；引用一律指向本册条目，不再各自抄写。

why_the_current_package_cannot_record_its_own_hash:
  statement: 一个提交的哈希由它自身内容算出，内容里写不进自己的哈希。
  consequence: 本册只登记已经成为过去的提交；当前包自己的候选 Commit 由报告与 Founder 侧回执承载。
  precedent: governance/receipts/candidate_freeze_receipt.yaml self_reference_resolved_after_the_fact
  not_a_workaround: >-
    这不是绕开要求。要求是「补报完整 40 位哈希」，补报的对象是 EP06 接收的那个候选——
    它已经存在，因此可以精确登记；EP06 自身的 Head 在提交那一刻才产生，随报告一并给出。

full_hash_required: true
abbreviation_forbidden: true
abbreviation_forbidden_basis: 项目 CLAUDE.md 硬规则「引用 Commit 必须写完整哈希，禁止「最新版」」

verification_recipe:
- git -C <candidate worktree> rev-parse <commit>   # 必须回显本册登记的同一 40 位值
- git -C <candidate worktree> log --format=%H -1 <commit>
- 引用一律使用完整哈希

