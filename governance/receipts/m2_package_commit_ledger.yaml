binding_consumers:
  purpose: 「此后一切绑定、复审对象与 TG-05 均以该哈希为准」——这里写清各自绑到哪一条。
  correction_by_b02_2:
    authority: DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001 article_3_b02_two_definitions_of_review_target B-02-2
    verbatim: "删除或更正 binding_consumers 中「审查对象尚未产生 / resolvable_now: false」的旧说明"
    what_was_stale: >-
      「本轮 Guardian / 总顾问 Delta 复审对象……对象尚未产生」写于分发前五步闸口径下，
      那时复审排在第 4 步。挂起裁决第三节把审查对象改为「结扎落盘后形成的最终候选」，
      对象随 9b60bda 产生并已被审过一轮。旧说明留着，会让读者以为审查至今启动不了。
  items:
  - consumer: TG-05 公开蓝图确认的冻结 Commit
    binds_to: 恢复序列第 3 步产出的最终分发前候选
    resolvable_now: false
    why_not_now: >-
      TG-05 要求 Founder 在一个指定冻结 Commit 上确认公开蓝图无需修改。
      该 Commit 在恢复序列第 3 步（落盘 founder_confirmation ＋ STORE-A intake）之后产生，
      而恢复序列尚未启动——M2 处于挂起。这一条**仍然**未解析，且理由与从前不同：
      不是「排在后面」，是「整条序列被挂起」。
    blocked_by: M2 挂起（m2_status = SUSPENDED_BY_FOUNDER）
  - consumer: 并入前审查 R1 的对象
    binds_to: 9b60bda06f372467243de36982c16d4bd6afea8d
    resolvable_now: true
    resolved_note: R1 已结束，两侧结论已登记。
  - consumer: 并入前审查 R2（窄范围 Delta）的对象
    binds_to: 本包候选（M2-PREMERGE-FIX）
    resolvable_now: true
    resolution: derived_from_git_head
    resolution_note: >-
      对象已经产生——就是承载本次修复的那个提交。它写不进自己，因此由 `git rev-parse HEAD` 现算，
      不写占位串。这是「已产生但写不进自己」，与从前的「尚未产生」不是同一件事。
  - consumer: 血统基线（bloodline_base_commit）
    binds_to: 03_m2_evaluation_foundation/steward/hidden_generation_input_bundle.v1.1.0.yaml
    resolvable_now: true
  - consumer: EP06 接收对象
    binds_to: 61be9b47bd3f4c74c9db102df577c5cf6aa334d2
    resolvable_now: true

