out_of_scope:
  rule: 已知为否，且已由机器状态如实记录，不需再确认。
  count: 4
  items:
  - M2 能否冻结
  - 18 项是否闭环
  - 隐藏资产是否存在
  - 阈值是否已定
  why_out_of_scope: >-
    这四件的答案都是「否」，而且否在哪里、否成什么样，仓内都有可复算的字段。
    再问一遍只会得到一份重复的否定结论，占掉本该用来找假状态与误导性基线的注意力。

review_record_contract:
  authority: DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001 article_4_b03_self_reported_fields_forgeable B-03-1
  required_fields: [reviewer_role, reviewed_commit, conclusion, report_path, report_sha256, issued_at]
  checker_duty_verbatim: >-
    判据须读取真实报告文件、重算 sha256，并核对报告内声明的 role、reviewed_commit、结论与 YAML 记录一致；
    Guardian 记录还须核对其隔离工作区已登记
  evidence_kinds:
    reviewer_authored_report: 评审方自己写的报告原文落盘于本仓。
    founder_ruling_transcription: >-
      报告原文未交到执行侧，仓内唯一可核的载体是 Founder 裁决对该结论的转录。
      这类记录不得被表述为「已取得报告原文」；判据核的是裁决文件里那一条款确实点名了
      该角色、该提交与该结论。
  what_this_replaces: >-
    此前 reviewers[] 只有 conclusion_received / conclusion / report 三个字段，
    判据只检查「有结论就得有非空 report 字符串」。一个自述字符串就能开门——
    填 conclusion: PASS、report: 「见邮件」，判据全绿。

