four_way_equality:
  rule: 一轮审查的对象只能有一个值，四处必须全等。
  authority: DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001 article_3_b02_two_definitions_of_review_target B-02-3
  sites:
  - 审查报告 reviewed_commit
  - 审查请求 review_target.commit
  - package ledger 当前条目
  - 实际 head（现场 git 推导）
  live_head_semantics: >-
    「实际 head」对一轮**已结束**的审查，指该提交必须在本分支现有历史上（ancestry 实测）；
    对**待审**的那一轮，指 `git rev-parse HEAD` 现算值，且请求文件里不得存该值——
    存下来的那一刻它就开始过期。
  disclosed_reading: >-
    裁决原文写「全等」。已结束那一轮的对象是 9b60bda，而本次修复形成新 head 后，
    live head 不再等于 9b60bda。执行侧按「该轮进行时的 head」理解：已结束的轮次核 ancestry，
    待审的轮次核现算 head。这是执行侧的读法，如与 Founder 原意不符请指正（OI-FIX-01）。
  failure_state: REVIEW_TARGET_MISMATCH

