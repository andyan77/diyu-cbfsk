concurrent_window_incident:
  what_happened: >-
    本裁决同时被发到两个执行窗口，两者在同一 worktree 上交错写入约十三分钟。
    本窗口写入区间 11:48–11:52，另一窗口 11:52–12:01。
  how_it_surfaced: >-
    本窗口一次 `assert s.count(old) == 1` 当场失败——目标文件在读取与写入之间被改过。
    这不是手滑，是丢更新的现场。
  hard_evidence:
  - ci/checkers/check_project_state.py（非本窗口所写）import 了本窗口 11:49:12 才创建的 ci/derived_state.py，函数名一字不差
  - 两窗口各自独立分配了同一个裁决编号 DIYU-CBFSK-FOUNDER-M2-PREMERGE-REVIEW-001，全仓 32 处引用
  - 另一窗口新建 governance/gates/scan_coverage_measurement_ledger.v0.1.yaml 与 artifact_change_since_delivery_freeze.v0.1.yaml
  - 发现时仓库为红：30+ 判据失败、2 份夹具失败、2 处 collect() 崩溃；两边都提交不了
  action_taken: 停止写入并向 Founder 报告，未在未澄清归属前继续。
  founder_decision: 关闭另一执行窗口，由本窗口接管收口。
  handling: >-
    保留另一窗口全部已落产物并在其上继续——复核属实且与本窗口设计一致，无需重做。
    与上一轮 f71617e 的处理口径相同：不重写、不回退、不删除。
  two_windows_same_worktree: true
  risk_acknowledged: >-
    交错写入期间可能发生过未被察觉的丢更新。本包全量自检通过，但自检通过不等于
    「没有内容在交错中丢失」——`git` 只看得见最后一次写入。该风险如实记录为 OI-FIX-05，
    执行侧不宣称已排除，供 R2 两侧复审留意。
  precedent_note: >-
    这是同一 worktree 并发写入第二次造成问题（第一次是 f71617e）。
    根因不在任一窗口，在派发：同一份裁决被发到两个执行面。

