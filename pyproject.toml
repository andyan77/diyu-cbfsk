[project]
name = "diyu-cbfsk-runtime"
version = "0.1.0"
description = "笛语跨品牌服装搭配专家内核 · BR0-EP01 运行时骨架（Tenant 安全根）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.51",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # starlette 1.6 的 TestClient 明确要求 httpx2；配 httpx1 时它自己也会发弃用警告，
    # 且 client.get 的类型整体退化为 Unknown，strict 档下直接报错。
    "httpx2>=2.10",
    "ruff>=0.9",
    # PRD v0.3.2 技术栈章节两处点名 Ruff、Pyright、pre-commit，未提任何其他类型检查器。
    # BR0-EP01 首版选错了工具，本次回归 PRD 指定的那一个。
    "pyright>=1.1.390",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["runtime", "tests"]
# 只检本包新落的运行时代码。ci/ 与 工具/ 是 M0/M1 已冻结的治理判据，
# BR0-EP01 不得顺手重排它们——那会让 Guardian 的审查面从「新增运行时」变成「全仓 diff」。
include = ["runtime/**/*.py", "tests/**/*.py", "alembic/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.isort]
# 显式声明本仓包名。不声明的话 ruff 靠 src 与已安装包推断首party，
# 本地（项目已 uv sync 进 .venv）与 CI 会推出不同结果，同一份代码两边排序不一致——
# 已复现：本地 all checks passed，CI 判 I001。
known-first-party = ["runtime", "tests"]

[tool.pyright]
# 与被取代的那套 strict 配置等价严格度。降 typeCheckingMode 等于把这道闸关掉——
# 报错要逐个真修，不许改档位、不许批量忽略。
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["runtime", "tests"]
exclude = ["**/__pycache__", ".venv", "web", "e2e", "ci", "工具", "alembic/versions"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
